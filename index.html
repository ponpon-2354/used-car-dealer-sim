<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>中古車販売店ゲーム</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif;background:#dff3e4;color:#4a3b2a;font-size:15px}
button{font-family:inherit;cursor:pointer;border:2px solid #b08954;border-radius:12px;background:#fffdf5;color:#4a3b2a;padding:8px 12px;font-size:15px;touch-action:manipulation;-webkit-tap-highlight-color:rgba(0,0,0,.08)}
button:active{transform:translateY(1px)}
button:disabled{opacity:.45;cursor:default}
button.good{background:#57b368;border-color:#3d8b4f;color:#fff;font-weight:bold}
button.primary{background:#ffb52e;border-color:#d18f12;color:#5a3d00;font-weight:bold}
button.danger{background:#e86a5e;border-color:#c24a3e;color:#fff}
input[type=text]{font-family:inherit;font-size:17px;padding:10px;border:2px solid #b08954;border-radius:10px;width:100%}
#topbar{position:sticky;top:0;z-index:30;background:#fff8e6;border-bottom:3px solid #e5c98c;display:flex;justify-content:space-between;align-items:center;padding:8px 12px;gap:8px;flex-wrap:wrap}
#topbar .date{font-weight:bold;font-size:15px}
#topbar .money{font-weight:bold;font-size:19px;color:#b97a00}
#topbar .pt{font-weight:bold;font-size:15px;color:#5b6abf}
#topbar .sold{font-size:13px;color:#7a6a55}
#main{max-width:640px;margin:0 auto;padding:8px 8px 96px}
#cvWrap{background:#c3d2cf;border:3px solid #8a9a8c;border-radius:16px;overflow:hidden}
canvas#cv{display:block;width:100%;aspect-ratio:480/360}
#nav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:#fff8e6;border-top:3px solid #e5c98c;display:flex;gap:5px;padding:8px;max-width:640px;margin:0 auto}
#nav button{flex:1;font-size:14px;font-weight:bold;padding:12px 1px;border-radius:14px;background:#fffdf5}
#nav button.on{background:#ffb52e;border-color:#d18f12;color:#5a3d00}
#nav .badge-n{display:inline-block;background:#e86a5e;color:#fff;border-radius:999px;font-size:11px;padding:0 6px;margin-left:2px}
.panel{background:#fffdf5;border:3px solid #e5c98c;border-radius:16px;padding:12px;margin-top:10px}
.panel h2{margin:2px 0 10px;font-size:18px}
.small{font-size:13px;color:#7a6a55}
.note{font-size:13px;color:#7a6a55;margin:6px 0}
.card{background:#fff;border:2px solid #ecd9ae;border-radius:14px;padding:10px;margin-bottom:10px}
.card h3{margin:0 0 6px;font-size:17px}
.carimg{display:block;width:100%;max-width:300px;height:auto;margin:0 auto 6px}
.carimg-big{max-width:330px;margin:8px auto}
.badge{display:inline-block;background:#eef4ff;border:1.5px solid #9db8dd;color:#33507e;border-radius:999px;font-size:12px;padding:1px 8px;margin-left:4px;vertical-align:middle}
.badge.st0{background:#fdeceb;border-color:#e0a49d;color:#8c3a30}
.badge.st1{background:#fff6da;border-color:#dec26a;color:#7a5c00}
.badge.st2{background:#e6f7e6;border-color:#7cc47f;color:#256b27}
.badge.combo{background:#fff0f6;border-color:#e58bb1;color:#a12c5f}
.specrow{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.spec{background:#faf3df;border-radius:10px;padding:5px 10px;font-size:14px}
.spec b{font-size:15px}
.moneyrow{display:flex;justify-content:space-between;padding:3px 0;font-size:15px}
.moneyrow .v{font-weight:bold}
.pricebig{font-size:24px;font-weight:bold;color:#b97a00}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row button{flex:1;min-height:48px}
.tierbtn.on{background:#ffb52e;border-color:#d18f12;color:#5a3d00;font-weight:bold}
#guide{background:#fff3c9;border:3px solid #f0b429;border-radius:14px;padding:10px 12px;margin-top:10px;font-size:16px}
#news{background:#eef7ee;border:2px solid #bcd8bc;border-radius:12px;padding:8px 12px;margin-top:10px;font-size:14px;min-height:20px}
#speedRow{display:flex;gap:6px;margin-top:8px}
#speedRow button{flex:1;padding:8px}
#speedRow button.on{background:#57b368;border-color:#3d8b4f;color:#fff;font-weight:bold}
.modal{position:fixed;inset:0;background:rgba(60,45,20,.55);display:none;z-index:100;align-items:flex-start;justify-content:center;overflow-y:auto;padding:14px 8px}
.modal.open{display:flex}
.mbox{background:#fffdf5;border:3px solid #b08954;border-radius:18px;max-width:520px;width:100%;padding:16px;margin:auto}
.mbox h2{margin:0 0 10px;font-size:20px}
.hpbar{background:#eee0c0;border:2px solid #b08954;border-radius:999px;height:22px;overflow:hidden;margin:6px 0}
.hpbar i{display:block;height:100%;background:linear-gradient(#7ed37e,#43a047);transition:width .3s}
.rankbig{font-size:30px;font-weight:bold;vertical-align:middle}
.rankchip{display:inline-block;min-width:26px;text-align:center;border-radius:8px;color:#fff;font-weight:bold;padding:2px 6px}
#titleScreen{position:fixed;inset:0;z-index:200;background:linear-gradient(#aee3f9 0%,#d8f5e3 55%,#fdf6da 100%);overflow-y:auto;display:none}
#titleScreen.open{display:block}
.title-inner{max-width:520px;margin:0 auto;padding:28px 14px 40px;text-align:center}
.title-inner h1{font-size:30px;margin:8px 0 4px;color:#7a4d00;text-shadow:0 2px 0 #fff}
.cloud{font-size:34px;letter-spacing:12px}
.slot{background:#fffdf5;border:3px solid #e5c98c;border-radius:16px;padding:12px;margin:12px 0;text-align:left}
.slot h3{margin:0 0 6px;font-size:17px}
.slot .row button{min-height:52px;font-size:16px}
#nameBox{background:#fffdf5;border:3px solid #f0b429;border-radius:16px;padding:14px;margin:12px 0;text-align:left;display:none}
.hidden{display:none!important}
.rankpop{font-size:44px;text-align:center}
.zukan-grid{display:flex;flex-wrap:wrap;gap:6px}
.zukan-cell{background:#fff;border:2px solid #ecd9ae;border-radius:10px;padding:6px 8px;font-size:13px;min-width:100px;flex:1}
.zukan-cell.undiscovered{color:#b6a888;background:#faf3df}
.slotpick{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.slotpick button{min-height:44px;flex:1 1 30%}
</style>
</head>
<body>

<!-- タイトル画面 -->
<div id="titleScreen">
  <div class="title-inner">
    <div class="cloud">☁️ ☁️ ☁️</div>
    <div style="font-size:52px">🚗</div>
    <h1>中古車販売店</h1>
    <p style="margin:0 0 6px;font-weight:bold;color:#5b7a4a">経営シミュレーション</p>
    <p class="small">軽自動車専門店から始めて、配置と整備で大きくしよう！</p>
    <div id="slotList"></div>
    <div id="nameBox">
      <p style="margin:0 0 8px"><b>お店の名前を決めてね</b>（12文字まで）<br><span class="small">看板にその名前が出るよ。あとから「店」の画面で変えることもできるよ。</span></p>
      <input type="text" id="shopNameInput" maxlength="12" placeholder="例: さくらモータース">
      <div class="row" style="margin-top:10px">
        <button class="primary" style="min-height:52px" onclick="confirmNewGame()">🚗 お店をはじめる！</button>
        <button onclick="cancelNewGame()">やめる</button>
      </div>
    </div>
  </div>
</div>

<!-- ゲーム画面 -->
<div id="gameScreen" class="hidden">
  <div id="topbar">
    <span class="date" id="tbDate">----</span>
    <span class="money" id="tbMoney">💰 ---万円</span>
    <span class="pt" id="tbPt">🔬 0 Pt</span>
    <span class="sold" id="tbSold">⭐ ---</span>
  </div>
  <div id="main">
    <div id="cvWrap"><canvas id="cv" width="960" height="720"></canvas></div>
    <div id="speedRow">
      <button id="sp0" onclick="setSpeed(0)">⏸ 止める</button>
      <button id="sp1" onclick="setSpeed(1)">▶ ふつう</button>
      <button id="sp2" onclick="setSpeed(2)">⏩ 早い</button>
      <button id="sp3" onclick="setSpeed(3)">⏭ とても早い</button>
    </div>
    <div id="guide" class="hidden"></div>
    <div id="news">🚗 お店を開きました！</div>
    <div id="panelRoot"></div>
  </div>
  <div id="nav">
    <button data-nav="shop" onclick="showPanel('shop')">🏠 店</button>
    <button data-nav="buy" onclick="showPanel('buy')">🚗 仕入れ</button>
    <button data-nav="work" onclick="showPanel('work')">🔧 整備<span class="badge-n" id="badgeWork" style="display:none"></span></button>
    <button data-nav="decor" onclick="showPanel('decor')">🪴 配置</button>
    <button data-nav="staff" onclick="showPanel('staff')">👥 仲間</button>
    <button data-nav="zukan" onclick="showPanel('zukan')">📖 図鑑</button>
  </div>
</div>

<!-- 今月のまとめ -->
<div class="modal" id="monthModal"><div class="mbox">
  <h2>📅 今月のまとめ</h2>
  <div id="monthBody"></div>
  <div class="row" style="margin-top:12px"><button class="primary" style="min-height:52px" onclick="closeMonth()">わかった！</button></div>
</div></div>

<!-- お知らせポップアップ -->
<div class="modal" id="popModal"><div class="mbox">
  <div id="popBody"></div>
  <div class="row" style="margin-top:12px"><button class="primary" style="min-height:52px" onclick="closeModal('popModal')">わかった！</button></div>
</div></div>

<!-- 上書き確認 -->
<div class="modal" id="askModal" style="z-index:300"><div class="mbox">
  <div id="askBody"></div>
  <div class="row" style="margin-top:12px">
    <button style="min-height:52px" onclick="closeModal('askModal')">やめる</button>
    <button class="primary" style="min-height:52px" onclick="askYes()">はい、はじめる</button>
  </div>
</div></div>

<script>
"use strict";
/* ================= 便利な関数 ================= */
function $(id){return document.getElementById(id);}
function ri(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function rnd(a,b){return a+Math.random()*(b-a);}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function man(yen){const m=yen/10000;const s=(Math.round(m*10)/10).toLocaleString("ja-JP",{maximumFractionDigits:1});return s+"万円";}
function manKm(km){return (Math.round(km/1000)/10).toLocaleString("ja-JP",{maximumFractionDigits:1})+"万km";}
function openModal(id){$(id).classList.add("open");}
function closeModal(id){$(id).classList.remove("open");}
function news(t){if(gameState)gameState.log=t;$("news").textContent=t;}

/* ================= セーブ（例外が出ても止まらない仕組み） ================= */
const LS={
  mem:{},
  get(k){try{return window.localStorage.getItem(k);}catch(e){return (k in this.mem)?this.mem[k]:null;}},
  set(k,v){try{window.localStorage.setItem(k,v);}catch(e){this.mem[k]=v;}},
  del(k){try{window.localStorage.removeItem(k);}catch(e){delete this.mem[k];}}
};
const SAVE_KEYS=["ponpoko_usedcar_slot1","ponpoko_usedcar_slot2","ponpoko_usedcar_slot3"];

const TYPES=["軽","コンパクト","セダン","SUV","ミニバン","スポーツ"];
const MODELS={

  "コンパクト":[["トヨタ","ヤリス",170],["ホンダ","フィット",160],["日産","ノート",155],["スズキ","スイフト",150],["トヨタ","アクア",150],["トヨタ","ルーミー",160],["スズキ","ソリオ",140],["ダイハツ","パッソ",110]],
  "セダン":[["トヨタ","プリウス",240],["トヨタ","カローラ",210],["ホンダ","アコード",260],["マツダ","MAZDA3",200],["トヨタ","クラウン",380],["トヨタ","カムリ",280],["日産","スカイライン",320],["トヨタ","マークX",180]],
  "SUV":[["スバル","フォレスター",280],["トヨタ","RAV4",300],["ホンダ","ヴェゼル",240],["マツダ","CX-5",260],["トヨタ","ハリアー",320],["日産","エクストレイル",260],["トヨタ","ランドクルーザー",550],["トヨタ","C-HR",230]],
  "ミニバン":[["ホンダ","ステップワゴン",290],["トヨタ","ノア",280],["日産","セレナ",270],["ホンダ","フリード",230],["トヨタ","アルファード",450],["トヨタ","ヴォクシー",300],["ホンダ","オデッセイ",280],["三菱","デリカD:5",330]],
  "スポーツ":[["トヨタ","GR86",320],["マツダ","ロードスター",260],["スバル","BRZ",310],["日産","フェアレディZ",450],["トヨタ","スープラ",550],["日産","GT-R",1200],["ホンダ","シビック TYPE R",480],["スバル","WRX",350]]
};
const COLORS=["レッド","ブルー","ホワイト","ブラック","シルバー","イエロー","グリーン","オレンジ","パープル","ベージュ"];
/* 車種ごとの本当の色（写真イラストの色で固定。色違いはなし） */
const MODEL_COLOR={"N-BOX":"ホワイト","タント":"ブルー","ハスラー":"オレンジ","ムーヴ":"ブルー","ワゴンR":"イエロー","N-ONE":"レッド","スペーシア":"ブルー","ジムニー":"イエロー","タフト":"オレンジ","デイズ":"オレンジ","N-WGN":"ホワイト","キャスト":"レッド","アルト":"レッド","エブリイ":"ホワイト","ハイゼットカーゴ":"ベージュ","eKワゴン":"パープル","ルークス":"レッド","ムーヴキャンバス":"グリーン","N-VAN":"シルバー","デリカミニ":"グリーン","ミライース":"イエロー","ヤリス":"レッド","フィット":"レッド","ノート":"ブルー","スイフト":"レッド","アクア":"ブルー","ルーミー":"レッド","ソリオ":"レッド","パッソ":"ベージュ","プリウス":"レッド","カローラ":"ホワイト","アコード":"レッド","MAZDA3":"レッド","クラウン":"シルバー","カムリ":"ホワイト","スカイライン":"ブルー","マークX":"ブラック","フォレスター":"グリーン","RAV4":"ホワイト","ヴェゼル":"レッド","CX-5":"レッド","ハリアー":"レッド","エクストレイル":"レッド","ランドクルーザー":"ベージュ","C-HR":"シルバー","ステップワゴン":"ブルー","ノア":"ホワイト","セレナ":"シルバー","フリード":"シルバー","アルファード":"ベージュ","ヴォクシー":"ブルー","オデッセイ":"ブルー","デリカD:5":"シルバー","GR86":"ブラック","ロードスター":"レッド","BRZ":"ブルー","フェアレディZ":"ブルー","スープラ":"シルバー","GT-R":"ブルー","シビック TYPE R":"ホワイト","WRX":"ブルー"};
const CAR_PAINT={"レッド":"#e5533d","ブルー":"#3d7de0","ホワイト":"#f4f6f8","ブラック":"#3a3f4a","シルバー":"#c9ced6","イエロー":"#f2c230","グリーン":"#57b368","オレンジ":"#f08a2e","パープル":"#9a6ad8","ベージュ":"#e3d3ae"};
const FIRST=["健太","美咲","翔太","結衣","大輔","恵子","直樹","千尋","浩二","誠","陽子","隆","さくら","悠真","葵","蓮"];
const LAST=["佐藤","鈴木","高橋","田中","伊藤","渡辺","山本","中村","小林","加藤","吉田","松本"];
const STAFF_NAMES=["タロウ","ハナコ","ジロウ","ユキ","ケンジ","ミキ","ショウ","アヤ","ダイチ","リン","ソラ","メイ"];
const COND_WORD=["いまいち","ふつう","ピカピカ"];
const RANKS=["F","E","D","C","B","A","S"];
const RANK_COLOR={"F":"#9aa0a6","E":"#5b8def","D":"#3aa655","C":"#e0a400","B":"#f08a2e","A":"#e5533d","S":"#d4a017"};
/* サイコロの出やすさ（1〜6の重み）。ランクが上がるほど いい目が出やすい */
const DICE_W={"F":[1,1,1,1,1,1],"E":[7,7,9,9,9,9],"D":[1,1,2,2,2,2],"C":[2,2,9,9,9,9],"B":[0,0,1,1,1,1],"A":[0,0,2,2,3,3],"S":[0,0,1,1,4,4]};
const DICE_FACE=["⚀","⚁","⚂","⚃","⚄","⚅"];
const RANK_SALARY={"F":12,"E":15,"D":18,"C":22,"B":28,"A":36,"S":48}; /* 万円/月 */
const BOSS_RANK_SALES=[0,3,8,15,25,40,60]; /* この台数売るとランクが上がる */
const SHOP_SIZES=[
  {name:"小さい店",cap:6,cost:0},
  {name:"中くらいの店",cap:10,cost:500},
  {name:"大きな店",cap:16,cost:1500}
];

/* ================================================================
   CONFIG（バランス調整はここだけ触ればいい）
   ================================================================ */
const CONFIG={
  startMoney:1000*10000,     /* 初期資金（円） */
  ticksPerDay:50,            /* 1日 = 50ティック（1ティック=100ms想定） */
  tickMs:100,
  marketPerDay:4,            /* 仕入れ市場に並ぶ台数 */
  buyRateMin:0.75, buyRateMax:0.9, /* 仕入値 = 相場×この範囲 */
  condMul:[0.85,1.0,1.15],   /* 状態倍率（いまいち/ふつう/ピカピカ） */
  tierMul:{"安い":0.95,"おすすめ":1.1,"高い":1.25},
  tierClose:{"安い":8,"おすすめ":0,"高い":-10}, /* 値段の付け方の成約率補正 */
  customMulPer:0.08,         /* カスタム1段ごとの価格倍率 */
  customCharm:8,             /* カスタム1段ごとの魅力 */
  baseCharm:{"軽":10,"コンパクト":12,"セダン":16,"SUV":16,"ミニバン":14,"スポーツ":26},
  closeBase:30,              /* 成約率の土台（%） */
  closeTypeMatch:22,         /* 希望タイプ一致 */
  closeBudgetIn:12,          /* 予算内 */
  closeBudgetOver:-18,       /* 予算オーバー */
  talkBonus:{"F":0,"E":3,"D":6,"C":10,"B":14,"A":18,"S":24},  /* 営業の話術 */
  mechFactor:{"F":0.7,"E":0.85,"D":1.0,"C":1.15,"B":1.3,"A":1.5,"S":1.8}, /* 整備の技術 */
  bossMechMul:0.8,           /* 整備士がいないとき社長がやる効率 */
  considerSec:3.2,           /* 商談ゲージが満ちるまでの秒数 */

  baitoPay:5*10000,          /* 洗車バイトの収入 */

  yearEndPrizes:[100,50,20], /* 年末ランキング賞金（万円）1位〜3位 */
};

/* ================================================================
   マスターデータ（種類を増やすときはここに足すだけ）
   ================================================================ */
/* 扱える車の解禁（売った台数で広がる）。最初は軽自動車専門店 */
const UNLOCKS=[{sold:0,types:["軽"]},{sold:10,types:["コンパクト"]},{sold:25,types:["セダン","SUV"]},{sold:45,types:["ミニバン"]},{sold:70,types:["スポーツ"]}];
function unlockedTypes(){
  const t=[];
  UNLOCKS.forEach(function(u){if((gameState?gameState.sold:0)>=u.sold)u.types.forEach(function(x){if(!t.includes(x))t.push(x);});});
  return t;
}
function nextUnlock(){
  for(let i=0;i<UNLOCKS.length;i++){if((gameState?gameState.sold:0)<UNLOCKS[i].sold)return UNLOCKS[i];}
  return null;
}
/* 店舗ランク（売った台数で上がる） */
const STORE_RANKS=[[0,"駆け出し店"],[10,"人気店"],[25,"有名店"],[45,"名門店"],[70,"伝説の店"]];
function storeRank(){

function normalizeSave(o){
  if(!o||typeof o!=="object")return null;
  const base=defaultState(o.shopName||"中古車店");
  const g=Object.assign(base,o);
  g.ver=3;
  if(g.pt===undefined)g.pt=0;
  if(g.yearSold===undefined)g.yearSold=g.sold||0;
  if(g.yearIncome===undefined)g.yearIncome=0;
  if(!g.decors)g.decors={};
  if(!Array.isArray(g.researched))g.researched=[];
  if(g.pit===undefined)g.pit=null;
  if(!Array.isArray(g.pitQueue))g.pitQueue=[];
  if(!g.zukanCars)g.zukanCars={};
  if(!g.zukanSpots)g.zukanSpots={};
  if(g.lastBaitoDay===undefined)g.lastBaitoDay=-1;
  if(g.tutStep===undefined)g.tutStep=3;
  /* 車の追加項目 */
  (g.cars||[]).forEach(function(c){
    if(c.charm===undefined)c.charm=CONFIG.baseCharm[c.type]||10;
    if(c.customLv===undefined)c.customLv=0;
    if(c.inPit===undefined)c.inPit=false;
    if(!c.tier)c.tier="おすすめ";
    if(MODEL_COLOR[c.name])c.color=MODEL_COLOR[c.name];
  });
  /* 仲間には役割（旧セーブは全員営業） */
  (g.staff||[]).forEach(function(s){if(!s.role)s.role="sales";});
  /* 市場は扱える車種だけにそろえる */
  const allow=[];
  UNLOCKS.forEach(function(u){if((g.sold||0)>=u.sold)u.types.forEach(function(x){if(!allow.includes(x))allow.push(x);});});
  if(g.market)g.market=g.market.filter(function(c){return allow.includes(c.type);});
  /* 図鑑に今ある車を登録しておく */
  (g.cars||[]).forEach(function(c){/* 在庫は未登録のままにする */});
  if(!g.plan)g.plan=null;
  return g;
}

/* 展示スポット: 上の段8・下の段8（左→右）。店の大きさで使える数が変わる */
function spotPos(idx){
  const col=idx%8, row=Math.floor(idx/8);
  const x=28+col*54+(row?18:0), y=row?162:88;
  return {x:x, y:y, w:54, h:44, cx:x+27, cy:y+22};
}
function spotCount(){return SHOP_SIZES[gameState.shopSize].cap;}
/* 展示中の車（ピットに入っていない車）→ スポット番号つき */
function displayedCars(){
  const list=gameState.cars.filter(function(c){return !c.inPit;});
  return list.slice(0,spotCount()).map(function(c,i){return {car:c, spot:i};});
}
function carSpot(carId){
  const d=displayedCars().find(function(x){return x.car.id===carId;});
  return d?d.spot:-1;
}
/* 装飾スロット: A=真ん中の列(0〜7) / B=下の列(8〜15)。隣のスポットを返す */
function decorSlotPos(idx){
  const col=idx%8, band=idx<8?0:1;
  const x=40+col*54, y=band?210:131;
  return {x:x, y:y, w:30, h:18, cx:x+15, cy:y+9};
}
function adjacentSpots(decorIdx){
  const col=decorIdx%8;
  if(decorIdx<8)return [col, 8+col];
  return [8+col];
}
function adjacentDecors(spotIdx){
  const col=spotIdx%8, row=Math.floor(spotIdx/8);
  const out=[];
  if(row===0){out.push(col);}
  else{out.push(col); out.push(8+col);}
  return out;
}
/* そのスポットにかかる相性効果 */
function spotEffects(spotIdx, car){
  const eff={priceMul:1, charmMul:1, closeAdd:0, combos:[]};
  if(spotIdx<0||!car)return eff;
  adjacentDecors(spotIdx).forEach(function(di){
    const did=gameState.decors[di];
    if(!did)return;
    COMBOS.forEach(function(cb){
      if(cb.decor===did&&cb.test(car)){
        eff.priceMul*=cb.priceMul; eff.charmMul*=cb.charmMul; eff.closeAdd+=cb.closeAdd;
        eff.combos.push(cb);
      }
    });
  });
  return eff;
}
function carCharm(car){
  const spot=carSpot(car.id);
  const eff=spotEffects(spot, car);
  return Math.round((car.charm + car.cond*3 + car.customLv*CONFIG.customCharm) * eff.charmMul);
}
/* 販売価格 ＝ 相場 × 値段の付け方 × 状態倍率 × カスタム倍率 × スポット倍率 */
function carPrice(car){
  const spot=carSpot(car.id);
  const eff=spotEffects(spot, car);
  let p=car.market * (CONFIG.tierMul[car.tier]||1.1) * CONFIG.condMul[car.cond] * (1+car.customLv*CONFIG.customMulPer) * eff.priceMul;
  return Math.max(10000, Math.round(p/10000)*10000);
}
/* 店の清潔感（置いた装飾から計算、最大15） */
function cleanliness(){
  let s=0;
  Object.keys(gameState.decors).forEach(function(k){const d=decorById(gameState.decors[k]);if(d)s+=d.clean;});
  return Math.min(15,s);

function pickCType(){
  const uts=unlockedTypes();
  const pool=CTYPES.filter(function(t){
    if(!t.prefs.some(function(p){return uts.includes(p);}))return false;
    if(t.need&&!t.need.some(function(p){return uts.includes(p);}))return false;
    return true;
  });
  let tot=0;pool.forEach(function(t){tot+=t.weight;});
  let r=Math.random()*tot;
  for(let i=0;i<pool.length;i++){r-=pool[i].weight;if(r<=0)return pool[i];}
  return pool[0];
}

const INK="#3a2e22";
function rr(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
function shade(hex,f){
  const n=parseInt(hex.slice(1),16);
  let r=(n>>16)&255,gg=(n>>8)&255,b=n&255;
  if(f>=1){r=Math.min(255,Math.round(r+(255-r)*(f-1)));gg=Math.min(255,Math.round(gg+(255-gg)*(f-1)));b=Math.min(255,Math.round(b+(255-b)*(f-1)));}
  else{r=Math.round(r*f);gg=Math.round(gg*f);b=Math.round(b*f);}
  return "rgb("+r+","+gg+","+b+")";
}
function poly(g,pts,fill,lw){
  g.beginPath();g.moveTo(pts[0][0],pts[0][1]);
  for(let i=1;i<pts.length;i++)g.lineTo(pts[i][0],pts[i][1]);
  g.closePath();
  if(fill){g.fillStyle=fill;g.fill();}
  g.strokeStyle=INK;g.lineWidth=lw||2.5;g.lineJoin="round";g.stroke();
}
function spark(g,x,y,r){
  g.beginPath();
  g.moveTo(x,y-r);g.quadraticCurveTo(x,y,x+r,y);g.quadraticCurveTo(x,y,x,y+r);g.quadraticCurveTo(x,y,x-r,y);g.quadraticCurveTo(x,y,x,y-r);
  g.fillStyle="#ffd94d";g.fill();g.strokeStyle=INK;g.lineWidth=1.4;g.stroke();
}
/* アイソメの箱（上面・側面・前面）を太い輪郭線で描く */
function isoBox(g,cx,cy,L,W,h,cols,lw){
  const ux=[L/2,L/4],vx=[-W/2,W/4];
  const A=[cx+ux[0]+vx[0],cy+ux[1]+vx[1]];
  const Bp=[cx+ux[0]-vx[0],cy+ux[1]-vx[1]];
  const C=[cx-ux[0]-vx[0],cy-ux[1]-vx[1]];
  const D=[cx-ux[0]+vx[0],cy-ux[1]+vx[1]];
  const up=function(p){return [p[0],p[1]-h];};
  const A2=up(A),B2=up(Bp),C2=up(C),D2=up(D);
  poly(g,[A,D,D2,A2],cols.side,lw);
  poly(g,[Bp,A,A2,B2],cols.front,lw);
  poly(g,[A2,B2,C2,D2],cols.top,lw);
  return {A:A,B:Bp,C:C,D:D};
}

function hairStyle(p){
  if(p.long)return "long";
  let h=0;const n=p.name||"";
  for(let i=0;i<n.length;i++)h=(h*31+n.charCodeAt(i))>>>0;
  return ["short","spiky","bob"][h%3];
}
function drawHair(g,x,y,p){
  const st=hairStyle(p);
  g.fillStyle=p.hair;g.strokeStyle=INK;g.lineWidth=2.4;g.lineJoin="round";
  if(st==="long"){
    rr(g,x-15.5,y-15,31,32,10);g.fill();g.stroke();
    g.fillStyle="#f2c9a0";g.beginPath();g.arc(x,y,12.6,0,7);g.fill();
    g.fillStyle=p.hair;g.beginPath();g.arc(x,y-2,13,Math.PI,0);g.lineTo(x+13,y-1);g.lineTo(x-13,y-1);g.closePath();g.fill();g.stroke();
  }else if(st==="spiky"){
    g.beginPath();
    const pts=[];
    for(let i=0;i<=6;i++){const a=Math.PI+Math.PI*(i/6);const r=(i%2===0)?17.5:13.5;pts.push([x+Math.cos(a)*r,y+Math.sin(a)*r]);}
    g.moveTo(pts[0][0],pts[0][1]);
    pts.forEach(function(pt){g.lineTo(pt[0],pt[1]);});
    g.lineTo(x+13.5,y+1);g.lineTo(x-13.5,y+1);g.closePath();g.fill();g.stroke();
  }else if(st==="bob"){
    g.beginPath();g.arc(x,y-1,14.6,Math.PI,0);g.lineTo(x+14.6,y+7);g.lineTo(x-14.6,y+7);g.closePath();g.fill();g.stroke();
  }else{ /* short */
    g.beginPath();g.arc(x,y-1.5,14.4,Math.PI,0);g.lineTo(x+14.4,y+1.5);g.lineTo(x-14.4,y+1.5);g.closePath();g.fill();g.stroke();
  }
}
function drawPerson(g,x,y,p){
  const bob=Math.sin(Date.now()/180+x)*1.2;
  y+=bob;
  /* 足元の影 */
  g.fillStyle="rgba(58,46,34,.20)";g.beginPath();g.ellipse(x,y+21,15,4.5,0,0,7);g.fill();
  /* くつ */

/* 車の絵は写真イラストそのまま（色違いなし）。状態が「ふつう」以外なら汚れ・キラキラだけ重ねる */
function carImgURL(car){
  if(!car)return "";
  const slug=CAR_SLUG[car.name];
  if(!slug)return vectorCarURL(car);
  if(car.cond===1)return "cars/"+slug+".webp";
  const key=car.name+"|"+car.cond;
  if(_carImgCache[key]!==undefined)return _carImgCache[key];
  if(!_carImgBusy[key]){
    _carImgBusy[key]=1;
    const im=new Image();
    im.onload=function(){
      let url="";
      try{url=processCarImage(im,car);}catch(e){url="";}
      _carImgCache[key]=url||("cars/"+slug+".webp");
      if(gameState)renderPanel();
    };
    im.onerror=function(){_carImgCache[key]=vectorCarURL(car);if(gameState)renderPanel();};
    im.src="cars/"+slug+".webp";
  }
  return "cars/"+slug+".webp"; /* 読み込み中は素のイラストを出す */
}
function vectorCarURL(car){
  const key="vec|"+car.name+"|"+car.color+"|"+car.cond;
  if(_carImgCache[key]!==undefined)return _carImgCache[key];
  let url="";
  try{
    const cv=document.createElement("canvas");cv.width=260;cv.height=150;
    const g=cv.getContext("2d");
    if(g){drawCarSide(g,car);url=cv.toDataURL("image/png");}
  }catch(e){url="";}
  _carImgCache[key]=url;
  return url;
}
/* 状態の表現だけ重ねる：いまいち=汚れ、ピカピカ=キラキラ */

  const W=520,H=Math.max(200,Math.round(W*im.height/im.width));
  const cv=document.createElement("canvas");cv.width=W;cv.height=H;
  const g=cv.getContext("2d");if(!g)return "";
  g.drawImage(im,0,0,W,H);
  if(car.cond===0){
    g.fillStyle="rgba(105,84,50,.28)";
    let seed=car.id*7919;
    function rnd2(){seed=(seed*1103515245+12345)&0x7fffffff;return seed/0x7fffffff;}
    for(let i=0;i<7;i++){
      const x=W*(0.15+rnd2()*0.7),y=H*(0.45+rnd2()*0.4),r=8+rnd2()*20;

   仲間の姿・社長・妻（画面上の動き）

const BOSS_HOME={x:330,y:272}, DESK_FRONT={x:405,y:296}, PIT_POS={x:88,y:262}, ENTRANCE={x:240,y:322};
let bossFig={x:BOSS_HOME.x,y:BOSS_HOME.y,tx:BOSS_HOME.x,ty:BOSS_HOME.y,mode:"idle",cuId:0,name:"社長",hair:"#6b4226",cloth:"#e5533d",bubble:"",bubbleT:0};
let wifeFig={x:286,y:250,tx:286,ty:250,wait:20,name:"妻",hair:"#2e2a26",cloth:"#f08a2e",long:true,bubble:"",bubbleT:0};
const WANDER=[[120,150],[300,150],[180,224],[90,224],[360,224],[240,296]];
function syncStaffFigs(){
  if(!gameState)return;
  staffFigs=staffFigs.filter(function(f){return gameState.staff.some(function(s){return s.id===f.sid;});});
  gameState.staff.forEach(function(s,i){
    if(!staffFigs.some(function(f){return f.sid===s.id;})){
      const home=s.role==="mech"?{x:40+i*26,y:290}:{x:352+i*26,y:246};
      staffFigs.push({sid:s.id,name:s.name,role:s.role,rank:s.rank,x:home.x,y:home.y,tx:home.x,ty:home.y,home:home,mode:"idle",cuId:0,
        hair:pick(["#6b4226","#2e2a26","#8a5a2b","#444"]),cloth:s.role==="mech"?"#3d7de0":"#57b368",bubble:"",bubbleT:0});
    }
  });
}
function figHome(f){
  const s=gameState.staff.find(function(x){return x.id===f.sid;});
  if(!s)return {x:352,y:246};
  const idx=gameState.staff.indexOf(s);
  return s.role==="mech"?{x:40+idx*26,y:290}:{x:352+idx*26,y:246};
}
function moveToward(p,tx,ty,speed){
  const dx=tx-p.x,dy=ty-p.y,dist=Math.hypot(dx,dy);
  if(dist<3){p.x=tx;p.y=ty;return true;}
  p.x+=dx/dist*Math.min(speed,dist);p.y+=dy/dist*Math.min(speed,dist);
  return false;
}
/* 空いている接客係を探す（営業の仲間→社長） */
function findAttendant(){
  for(let i=0;i<staffFigs.length;i++){
    const f=staffFigs[i];
    const s=gameState.staff.find(function(x){return x.id===f.sid;});
    if(s&&s.role==="sales"&&f.mode==="idle")return {kind:"staff",sid:f.sid,fig:f,rank:s.rank};
  }
  if(bossFig.mode==="idle")return {kind:"boss",fig:bossFig,rank:bossRank()};
  return null;
}
function releaseAttendant(cu){
  if(!cu.attendant)return;
  const a=cu.attendant;
  a.fig.mode="idle";a.fig.cuId=0;
  const h=a.kind==="boss"?BOSS_HOME:figHome(a.fig);
  a.fig.tx=h.x;a.fig.ty=h.y;
  cu.attendant=null;
}
/* 整備の技術係数（一番うまい整備士。いなければ社長×0.8） */
function mechFactor(){
  let best=0;
  gameState.staff.forEach(function(s){if(s.role==="mech")best=Math.max(best,CONFIG.mechFactor[s.rank]||1);});
  if(best>0)return best;
  return (CONFIG.mechFactor[bossRank()]||1)*CONFIG.bossMechMul;
}
function mechName(){
  let bn="",best=0;
  gameState.staff.forEach(function(s){if(s.role==="mech"&&(CONFIG.mechFactor[s.rank]||0)>best){best=CONFIG.mechFactor[s.rank];bn=s.name;}});
  return bn||"社長";
}

/* ================================================================
   整備ピット
   ================================================================ */
function startWork(carId,workKey){
  const w=WORKS[workKey];if(!w)return;
  const car=gameState.cars.find(function(c){return c.id===carId;});
  if(!car||car.inPit)return;
  if(car.reservedBy){news("👀 お客さんが見ている車は整備に出せません");return;}
  if(w.research&&!gameState.researched.includes(w.research)){news("🔬 先に「カスタム研究」が必要です（整備の画面の下）");return;}
  if(workKey==="custom"&&car.customLv>=3){news("🎨 カスタムは3段までです");return;}
  if(workKey==="wash"&&car.cond>=2){news("✨ もうピカピカです");return;}
  if(gameState.money<w.cost*10000){news("💦 お金が足りません");return;}
  if(gameState.pit&&gameState.pitQueue.length>=2){news("🔧 ピットがいっぱいです。終わるまで待ってね");return;}
  gameState.money-=w.cost*10000;
  gameState.month.expense+=w.cost*10000;
  car.inPit=true;
  if(!gameState.pit)gameState.pit={carId:carId,work:workKey,prog:0};
  else gameState.pitQueue.push({carId:carId,work:workKey});
  news(w.emoji+" "+car.name+" の"+w.name+"をはじめました（担当："+mechName()+"）");
  renderAll();autoSave();
}
function finishWork(){
  const pit=gameState.pit;if(!pit)return;
  const car=gameState.cars.find(function(c){return c.id===pit.carId;});
  const w=WORKS[pit.work];
  if(car){
    if(pit.work==="wash")car.cond=Math.min(2,car.cond+1);
    else if(pit.work==="repair"){car.cond=2;car.charm+=5;}
    else if(pit.work==="custom"){car.customLv=Math.min(3,car.customLv+1);}
    car.inPit=false;
    gameState.pt+=w.pt;
    addFloat(PIT_POS.x,PIT_POS.y-46,(pit.work==="custom"?"カスタム完了！":"ピカピカ！")+" +"+w.pt+"Pt","#3d8b4f");
    news(w.emoji+" "+car.name+" の"+w.name+"が終わりました！（技術Pt +"+w.pt+"）");
    checkCombos();
  }
  gameState.pit=null;
  if(gameState.pitQueue.length){
    const nx=gameState.pitQueue.shift();
    gameState.pit={carId:nx.carId,work:nx.work,prog:0};
  }
  renderAll();autoSave();
}
function tickPit(){
  if(!gameState.pit)return;
  const w=WORKS[gameState.pit.work];
  gameState.pit.prog+=mechFactor()/(w.days*CONFIG.ticksPerDay);
  /* 整備士の姿をピットへ */
  let fig=null;
  for(let i=0;i<staffFigs.length;i++){const s=gameState.staff.find(function(x){return x.id===staffFigs[i].sid;});if(s&&s.role==="mech"){fig=staffFigs[i];break;}}
  const target=fig||(bossFig.mode==="idle"?bossFig:null);
  if(target){target.tx=PIT_POS.x+34;target.ty=PIT_POS.y+16;}
  if(gameState.pit.prog>=1)finishWork();
}

/* ================================================================
   お客さんのステートマシン
   ================================================================ */
function closingChance(cu){
  const car=gameState.cars.find(function(c){return c.id===cu.carId;});
  if(!car)return 0;
  const price=carPrice(car);
  let ch=CONFIG.closeBase;
  if(car.type===cu.wantType)ch+=CONFIG.closeTypeMatch;
  ch+=(price<=cu.budget)?CONFIG.closeBudgetIn:CONFIG.closeBudgetOver;
  const charm=carCharm(car);
  ch+=(charm>=24?8:(charm>=16?4:0));
  if(cu.attendant)ch+=CONFIG.talkBonus[cu.attendant.rank]||0;
  ch+=cleanliness();
  const eff=spotEffects(carSpot(car.id),car);
  ch+=eff.closeAdd;
  ch+=CONFIG.tierClose[car.tier]||0;
  return clamp(Math.round(ch),5,95);
}
function removeVisitor(id){
  const cu=visitors.find(function(v){return v.id===id;});
  if(cu){
    if(cu.carId){const car=gameState.cars.find(function(c){return c.id===cu.carId;});if(car&&car.reservedBy===cu.id)car.reservedBy=0;}
    releaseAttendant(cu);
  }
  visitors=visitors.filter(function(v){return v.id!==id;});
}
function resolveSale(cu){
  const car=gameState.cars.find(function(c){return c.id===cu.carId;});
  if(!car||car.inPit){cu.state="leave";cu.tx=ENTRANCE.x;cu.ty=ENTRANCE.y;return;}
  const chance=closingChance(cu);
  const price=carPrice(car);
  if(Math.random()*100<chance){
    cu.state="pay";cu.tx=DESK_FRONT.x;cu.ty=DESK_FRONT.y;
    cu.bubble="買います！";cu.bubbleT=2;
    releaseAttendant(cu);
  }else{
    cu.bubble=(price>cu.budget)?"💢 高い…":"💢 うーん…";
    cu.bubbleT=2.2;
    if(car.reservedBy===cu.id)car.reservedBy=0;
    releaseAttendant(cu);
    cu.state="leave";cu.tx=ENTRANCE.x;cu.ty=ENTRANCE.y;
    news(cu.name+"さん（"+cu.arch+"）は買わずに帰りました");
    renderPanel();
  }
}
function finishSale(cu){
  const car=gameState.cars.find(function(c){return c.id===cu.carId;});
  if(!car)return;
  const price=carPrice(car);
  const typesBefore=unlockedTypes();
  gameState.money+=price;
  gameState.month.income+=price;gameState.month.sold++;
  gameState.sold++;gameState.yearSold++;gameState.yearIncome+=price;
  gameState.pt+=1;
  const oldRank=bossRank();
  gameState.bossExp++;
  /* 相性スポットの登録（売れた車にかかっていたもの） */
  spotEffects(carSpot(car.id),car).combos.forEach(function(cb){gameState.zukanSpots[cb.id]=true;});
  gameState.zukanCars[car.name]=true;
  gameState.cars=gameState.cars.filter(function(c){return c.id!==car.id;});
  addFloat(DESK_FRONT.x,DESK_FRONT.y-52,"成約！","#d6336c");
  addFloat(DESK_FRONT.x,DESK_FRONT.y-34,"+"+man(price),"#b97a00");
  news("🎉 "+cu.name+"さん（"+cu.arch+"）が "+car.name+" を "+man(price)+" で買ってくれました！");
  if(gameState.tutStep<2)gameState.tutStep=2;
  const newTypes=unlockedTypes().filter(function(t){return !typesBefore.includes(t);});
  let pop="";
  if(bossRank()!==oldRank){
    pop+="<div class='rankpop'>🎊</div><p style='text-align:center;font-size:18px'><b>社長の営業ランクが上がった！</b><br>営業ランク <span class='rankbig' style='color:"+RANK_COLOR[bossRank()]+"'>"+bossRank()+"</span><br><span class='small'>話術が上がって 成約率アップ</span></p>";
  }
  if(newTypes.length){
    pop+="<div class='rankpop'>🚀</div><p style='text-align:center;font-size:18px'><b>新しい車が扱えるようになった！</b><br><b>"+newTypes.join(" と ")+"</b> も仕入れられるよ<br><span class='small'>お店が どんどん大きくなっていくね</span></p>";
  }
  if(pop){$("popBody").innerHTML=pop;openModal("popModal");}
  renderAll();autoSave();
}
function tickCustomers(){
  visitors.slice().forEach(function(cu){
    if(cu.bubbleT>0)cu.bubbleT-=0.1;
    if(cu.state==="enter"){
      if(moveToward(cu,cu.tx,cu.ty,CONFIG.custSpeed)){
        const car=gameState.cars.find(function(c){return c.id===cu.carId;});
        if(!car||car.inPit){
          if(car&&car.reservedBy===cu.id)car.reservedBy=0;
          cu.state="leave";cu.tx=ENTRANCE.x;cu.ty=ENTRANCE.y;
        }else{
          cu.state="consider";cu.gauge=0;
          cu.attendant=findAttendant();
          if(cu.attendant){cu.attendant.fig.mode="attend";cu.attendant.fig.cuId=cu.id;}
        }
      }
    }else if(cu.state==="browse"){
      moveToward(cu,cu.tx,cu.ty,CONFIG.custSpeed);
      cu.waitT--;
      if(cu.waitT<=0){cu.state="leave";cu.tx=ENTRANCE.x;cu.ty=ENTRANCE.y;}
    }else if(cu.state==="consider"){
      cu.gauge+=1/(CONFIG.considerSec*10);
      if(cu.attendant){
        cu.attendant.fig.tx=cu.x+22;cu.attendant.fig.ty=cu.y;
      }
      cu.bubble=cu.emoji+" 成約率"+closingChance(cu)+"%";cu.bubbleT=0.3;
      if(cu.gauge>=1)resolveSale(cu);
    }else if(cu.state==="pay"){
      if(moveToward(cu,cu.tx,cu.ty,CONFIG.custSpeed)){
        finishSale(cu);
        cu.state="leave";cu.tx=ENTRANCE.x;cu.ty=ENTRANCE.y;
        if(cu.carId){/* 車は消えている */}
      }
    }else if(cu.state==="leave"){
      if(moveToward(cu,cu.tx,cu.ty,CONFIG.custSpeed))removeVisitor(cu.id);
    }
  });
}
function tickFigs(){
  /* 社長・仲間の移動 */
  [bossFig].concat(staffFigs).forEach(function(f){
    if(f.bubbleT>0)f.bubbleT-=0.1;
    if(f.mode==="attend"){
      const cu=visitors.find(function(v){return v.id===f.cuId;});
      if(!cu){f.mode="idle";const h=(f===bossFig)?BOSS_HOME:figHome(f);f.tx=h.x;f.ty=h.y;}
      else{f.tx=cu.x+22;f.ty=cu.y;}
    }else if(gameState.pit&&f!==bossFig&&f.role==="mech"){
      f.tx=PIT_POS.x+34;f.ty=PIT_POS.y+16;
    }else if(gameState.pit&&f===bossFig&&!gameState.staff.some(function(s){return s.role==="mech";})){
      f.tx=PIT_POS.x+34;f.ty=PIT_POS.y+16;
    }
    moveToward(f,f.tx,f.ty,CONFIG.staffSpeed);
  });
  /* 妻は店内をお散歩 */
  if(wifeFig.bubbleT>0)wifeFig.bubbleT-=0.1;
  if(moveToward(wifeFig,wifeFig.tx,wifeFig.ty,1.1)){
    wifeFig.wait--;
    if(wifeFig.wait<=0){
      const s=pick(WANDER);wifeFig.tx=s[0]+ri(-12,12);wifeFig.ty=s[1]+ri(-6,6);wifeFig.wait=ri(20,50);
      if(Math.random()<0.3){wifeFig.bubble=pick(["いらっしゃいませ！","いい車そろってますよ","お茶どうぞ🍵",gameState.shopName+"は今日も元気！"]);wifeFig.bubbleT=2.5;}
    }
  }
}

   時間の進行
   ================================================================ */
let marketDirty=false;
function daysInMonth(y,m){return new Date(y,m,0).getDate();}
function nextDay(){
  gameState.days++;gameState.d++;
  ensurePlan();
  /* 今日来るお客さん */
  if(gameState.plan){
    const today=gameState.plan.days.filter(function(d){return d===gameState.d;}).length;
    const already=gameState.plan.days.filter(function(d){return d<gameState.d;}).length;
    let due=already+today;
    while(gameState.plan.spawned<due){spawnCustomer();gameState.plan.spawned++;}
  }
  /* 市場の入れ替え（仕入れ画面を開いている間は保留） */
  if(curPanel==="buy")marketDirty=true;else refreshMarket();
  if(gameState.d>daysInMonth(gameState.y,gameState.m))monthClose();
  renderTop();renderPanel();autoSave();
}
function genCandidates(){
  gameState.candidates=[];
  for(let i=0;i<3;i++){
    const role=Math.random()<0.55?"sales":"mech";
    const rank=pick(["F","F","E","E","D","D","C","B","A"]);
    gameState.candidates.push({id:gameState.nextId++,name:pick(STAFF_NAMES),role:role,rank:rank,salary:RANK_SALARY[rank]});
  }
}
function monthClose(){
  const pm=gameState.m, py=gameState.y;
  const salary=gameState.staff.reduce(function(a,s){return a+s.salary*10000;},0);
  gameState.money-=salary;
  gameState.month.expense+=salary;
  let extra="";
  if(pm===12){
    const rank=1+RIVALS.filter(function(r){return r.sold>gameState.yearSold;}).length;
    let prize=0;
    if(rank<=3){prize=CONFIG.yearEndPrizes[rank-1]*10000;gameState.money+=prize;gameState.pt+=5;}
    extra="<div class='moneyrow'><span>🏆 年末ランキング</span><span class='v'>"+rank+"位（今年 "+gameState.yearSold+"台）</span></div>"+
      (prize?"<div class='moneyrow'><span>🎁 賞金＋技術Pt</span><span class='v'>"+man(prize)+" ＋ 5Pt</span></div>":"<div class='moneyrow'><span>🎁 賞金</span><span class='v'>なし（来年こそ！）</span></div>");
    gameState.yearSold=0;gameState.yearIncome=0;
  }
  $("monthBody").innerHTML=
    "<p style='text-align:center;font-size:17px'><b>"+py+"年"+pm+"月</b> の結果</p>"+
    "<div class='moneyrow'><span>🎉 売れた車</span><span class='v'>"+gameState.month.sold+"台</span></div>"+
    "<div class='moneyrow'><span>💰 売上</span><span class='v'>"+man(gameState.month.income)+"</span></div>"+
    "<div class='moneyrow'><span>💸 出ていったお金（給料・整備など）</span><span class='v'>"+man(gameState.month.expense)+"</span></div>"+
    extra+
    "<div class='moneyrow'><span>🏦 今のお金</span><span class='v'>"+man(gameState.money)+"</span></div>"+
    (gameState.money<CONFIG.baitoMoneyLine?"<p class='note'>お金がピンチ…「店」の画面の 🧽 洗車バイト で立て直そう。</p>":"");
  openModal("monthModal");
  gameState.month={sold:0,income:0,expense:0};
  gameState.m++;if(gameState.m>12){gameState.m=1;gameState.y++;}
  gameState.d=1;
  gameState.plan=null;ensurePlan();
  genCandidates();
  news("📅 "+gameState.y+"年"+gameState.m+"月になりました");
}
function closeMonth(){closeModal("monthModal");renderAll();autoSave();}

/* 救済コマンド：洗車バイト（1日1回・お金が少ないとき） */

}

function line(g,x1,y1,x2,y2){ g.beginPath(); g.moveTo(x1,y1); g.lineTo(x2,y2); g.stroke(); }
function drawTree(g,x,y,s){
  g.fillStyle='rgba(40,45,40,.18)'; g.beginPath(); g.ellipse(x,y+16*s,13*s,4*s,0,0,7); g.fill();
  g.fillStyle='#8a6f4d'; rr(g,x-2.5*s,y+2,5*s,15*s,2); g.fill();
  g.fillStyle='#4e9e4e'; g.beginPath(); g.arc(x,y,13*s,0,7); g.fill();
  g.fillStyle='#63bb63'; g.beginPath(); g.arc(x-6*s,y+4*s,9*s,0,7); g.arc(x+6*s,y+4*s,9*s,0,7); g.fill();
  g.fillStyle='#83d183'; g.beginPath(); g.arc(x-3*s,y-4*s,6*s,0,7); g.fill();
}
/* 立体感のある車（上・前・横が見えるクォータービュー） */
function drawIsoCar(g,cx,gy,car){
  const base=CAR_PAINT[car.color]||'#d8d8d8';
  const dark=shade(base,0.7), light=shade(base,1.3);
  const P={ '軽':{L:52,H:15,C:15,CL:32}, 'コンパクト':{L:56,H:14,C:11,CL:30}, 'セダン':{L:58,H:13,C:10,CL:32}, 'SUV':{L:57,H:17,C:13,CL:32}, 'ミニバン':{L:56,H:16,C:15,CL:38}, 'スポーツ':{L:58,H:11,C:8,CL:26} }[car.type]||{L:56,H:14,C:11,CL:30};
  const L=P.L, x0=cx-L/2, x1=cx+L/2, bodyTop=gy-P.H-7, bodyBot=gy-3;
  g.fillStyle='rgba(40,45,40,.25)'; g.beginPath(); g.ellipse(cx,gy+1,L/2+5,5.5,0,0,7); g.fill();
  g.fillStyle=base; rr(g,x0,bodyTop,L,P.H+4,5); g.fill(); g.strokeStyle=INK; g.lineWidth=1.6; g.stroke();
  g.fillStyle=dark; rr(g,x0,bodyTop,10,P.H+4,4); g.fill();
  const cabX0=cx-P.CL/2+2, cabX1=cx+P.CL/2+4, cabTop=bodyTop-P.C+3;
  g.fillStyle='#bfe0ea'; g.beginPath();
  g.moveTo(cabX0+4,bodyTop+1); g.lineTo(cabX0+9,cabTop); g.lineTo(cabX1-3,cabTop); g.lineTo(cabX1+2,bodyTop+1); g.closePath(); g.fill();
  g.strokeStyle=INK; g.lineWidth=1.4; g.stroke();
  g.fillStyle=light; rr(g,cabX0+9,cabTop-3,P.CL-12,5,2); g.fill(); g.strokeStyle=INK; g.lineWidth=1.1; g.stroke();
  g.strokeStyle='rgba(58,51,40,.5)'; g.lineWidth=1.2; line(g,cx+3,cabTop+1,cx+3,bodyTop);
  g.strokeStyle='rgba(58,51,40,.32)'; line(g,cx-7,bodyTop+3,cx-7,bodyBot-2); line(g,cx+13,bodyTop+3,cx+13,bodyBot-2);
  g.fillStyle='#ffe9a8'; rr(g,x0+1,bodyTop+P.H-4,5,4,1.5); g.fill();
  g.fillStyle='#e2574c'; rr(g,x1-5,bodyTop+P.H-4,4,4,1.5); g.fill();
  g.fillStyle='#ffffff'; rr(g,x0+3,bodyBot-6,8,5,1); g.fill(); g.strokeStyle=INK; g.lineWidth=.8; g.stroke();
  [x0+11,x1-11].forEach(wx=>{ g.fillStyle='#2c2c30'; g.beginPath(); g.ellipse(wx,bodyBot+1,6.5,4.5,0,0,7); g.fill(); g.fillStyle='#cfd4d8'; g.beginPath(); g.ellipse(wx,bodyBot+1,3,2.2,0,0,7); g.fill(); });
  if(car.cond===0){ g.fillStyle='rgba(122,84,40,.38)'; [[-14,2],[6,4],[16,1],[-2,5]].forEach(([dx,dy])=>{ g.beginPath(); g.ellipse(cx+dx,bodyTop+dy+4,4.5,2.6,0,0,7); g.fill(); }); }
  if(car.cond===2){ spark(g,x0+8,bodyTop-4,5); spark(g,x1-8,cabTop-2,4); }
}
function drawScene(){
  const cvEl=$('cv'); if(!cvEl||!gameState)return;
  const g=cvEl.getContext('2d'); if(!g)return;
  g.setTransform(2,0,0,2,0,0);
  g.clearRect(0,0,480,360);
  const s=gameState;
  /* 芝生ベース */
  g.fillStyle='#a5d68a'; g.fillRect(0,0,480,360);
  /* 建物 */
  g.fillStyle='rgba(40,45,40,.15)'; rr(g,154,36,180,52,6); g.fill();
  g.fillStyle='#fff6dd'; rr(g,150,30,180,54,5); g.fill(); g.strokeStyle=INK; g.lineWidth=1.6; g.stroke();
  g.fillStyle='#7a9cc6'; g.beginPath(); g.moveTo(140,30); g.lineTo(340,30); g.lineTo(318,8); g.lineTo(162,8); g.closePath(); g.fill(); g.strokeStyle=INK; g.stroke();
  g.fillStyle='#ffffff'; rr(g,180,11,120,17,3); g.fill(); g.strokeStyle=INK; g.lineWidth=1.2; g.stroke();
  g.fillStyle=INK; g.font='bold 11px sans-serif'; g.textAlign='center'; g.fillText(s.shopName,240,23.5);
  g.fillStyle='#e2574c'; g.fillRect(150,40,180,7);
  g.fillStyle='#bfe0ea'; rr(g,160,52,36,24,2); g.fill(); g.strokeStyle=INK; g.lineWidth=1.2; g.stroke();
  rr(g,222,52,36,24,2); g.fill(); g.stroke();
  g.fillStyle='#8a6f4d'; rr(g,290,50,28,34,2); g.fill(); g.strokeStyle=INK; g.stroke();
  g.fillStyle='#ffd94d'; g.beginPath(); g.arc(311,68,2,0,7); g.fill();
  /* 木（奥） */
  drawTree(g,52,58,1.15); drawTree(g,428,58,1.15); drawTree(g,116,64,0.9); drawTree(g,364,64,0.9);
  /* 駐車場（アスファルト） */
  g.fillStyle='#b9bfba'; rr(g,14,84,452,232,8); g.fill(); g.strokeStyle='rgba(58,51,40,.35)'; g.lineWidth=1.5; g.stroke();
  g.fillStyle='rgba(58,51,40,.06)';
  for(let i=0;i<130;i++){ g.fillRect(18+((i*67)%444), 88+((i*41)%224), 3, 2); }
  /* 展示スポット */
  for(let i=0;i<16;i++){
    const p=spotPos(i), open=i<spotCount();
    g.beginPath(); g.moveTo(p.x+4,p.y+4); g.lineTo(p.x+p.w,p.y+4); g.lineTo(p.x+p.w-4,p.y+p.h); g.lineTo(p.x,p.y+p.h); g.closePath();
    if(open){ g.fillStyle='rgba(255,255,255,.20)'; g.fill(); g.strokeStyle='rgba(255,255,255,.65)'; g.lineWidth=1.4; g.stroke(); }
    else { g.fillStyle='rgba(40,45,40,.10)'; g.fill(); }
    if(!open){ g.font='13px sans-serif'; g.textAlign='center'; g.fillText('🔒',p.cx,p.cy+5); }
    else if(!s.cars[i]){ g.fillStyle='rgba(58,51,40,.35)'; g.font='bold 9px sans-serif'; g.textAlign='center'; g.fillText('空き',p.cx,p.y+p.h-4); }
  }
  /* 装飾スロット */
  for(let i=0;i<16;i++){
    const d=decorSlotPos(i), id=s.decors[i];
    g.fillStyle='rgba(255,255,255,.25)'; rr(g,d.x,d.y,d.w,d.h,4); g.fill();
    if(id){ const dc=decorById(id); g.font='17px sans-serif'; g.textAlign='center'; g.fillText(dc.emoji,d.cx,d.cy+6); }
    else { g.strokeStyle='rgba(255,255,255,.5)'; g.lineWidth=1; rr(g,d.x+3,d.y+3,d.w-6,d.h-6,3); g.stroke(); }
  }
  /* 展示車＋値札 */
  for(let i=0;i<16;i++){
    const car=s.cars[i]; if(!car) continue;
    const p=spotPos(i), combo=spotEffects(i,car).combos.length>0;
    if(combo){ g.strokeStyle='#ff7eb6'; g.lineWidth=2.4; rr(g,p.x-2,p.y-2,p.w+4,p.h+6,7); g.stroke(); spark(g,p.x+p.w-2,p.y-2,5); }
    drawIsoCar(g,p.cx,p.y+40,car);
    g.fillStyle='#f08a2e'; rr(g,p.cx-18,p.y-13,36,13,4); g.fill(); g.strokeStyle=INK; g.lineWidth=1; g.stroke();
    g.fillStyle='#fff'; g.font='bold 9px sans-serif'; g.textAlign='center'; g.fillText(man(car.price),p.cx,p.y-3);
  }
  /* 整備ピット */
  g.fillStyle='#e9dcbc'; rr(g,10,238,168,76,6); g.fill(); g.strokeStyle=INK; g.lineWidth=1.4; g.stroke();
  g.fillStyle='#8a6f4d'; rr(g,10,238,168,17,6); g.fill();
  g.fillStyle='#fff'; g.font='bold 10px sans-serif'; g.textAlign='center'; g.fillText('🔧 整備ピット',94,250);
  if(s.pit){
    const pcar=s.cars.find(c=>c.id===s.pit.carId);
    if(pcar) drawIsoCar(g,PIT_POS.x,PIT_POS.y+16,pcar);
    const r=s.pit.prog;
    g.fillStyle='#fff'; g.font='bold 9px sans-serif'; g.textAlign='right'; g.fillText(WORKS[s.pit.work].name+'中 '+Math.floor(r*100)+'%',172,250);
    g.fillStyle='#fff'; rr(g,24,298,120,9,4); g.fill(); g.strokeStyle=INK; g.lineWidth=1; g.stroke();
    g.fillStyle='#63bb63'; rr(g,25,299,118*r,7,3); g.fill();
    g.fillStyle=INK; s.pitQueue.forEach((q,qi)=>{ const qc=s.cars.find(c=>c.id===q.carId); if(qc){ g.font='9px sans-serif'; g.textAlign='left'; g.fillText('⏳'+qc.name,124,276+qi*11); } });
  } else { g.fillStyle='rgba(58,51,40,.45)'; g.font='10px sans-serif'; g.textAlign='center'; g.fillText('（整備メニューから作業できるよ）',94,282); }
  /* 商談デスク */
  g.fillStyle='#dfe9f5'; rr(g,316,238,156,76,6); g.fill(); g.strokeStyle=INK; g.lineWidth=1.4; g.stroke();
  g.fillStyle='#b08954'; rr(g,332,264,124,24,4); g.fill(); g.strokeStyle=INK; g.stroke();
  g.fillStyle='#8a6f4d'; rr(g,332,264,124,7,3); g.fill();
  g.fillStyle=INK; g.font='bold 10px sans-serif'; g.textAlign='center'; g.fillText('💰 商談デスク',394,252);
  /* 柵と街灯 */
  g.strokeStyle='#8a8f8a'; g.lineWidth=2;
  line(g,14,316,214,316); line(g,266,316,466,316); line(g,14,309,214,309); line(g,266,309,466,309);
  for(let fx=20;fx<470;fx+=26){ if(fx>208&&fx<272) continue; line(g,fx,306,fx,318); }
  [204,276].forEach(lx=>{ g.strokeStyle=INK; g.lineWidth=2; line(g,lx,318,lx,294); g.fillStyle='#ffe9a8'; g.beginPath(); g.arc(lx,292,4,0,7); g.fill(); g.strokeStyle=INK; g.lineWidth=1; g.stroke(); });
  g.fillStyle=INK; g.font='bold 10px sans-serif'; g.textAlign='center'; g.fillText('入口',240,313);
  /* 歩道と道路 */
  g.fillStyle='#cfd4cd'; g.fillRect(0,320,480,10);
  g.fillStyle='#6f7477'; g.fillRect(0,330,480,30);
  g.strokeStyle='#f5f2e8'; g.lineWidth=2; g.setLineDash([14,12]); line(g,0,345,480,345); g.setLineDash([]);
  roadCars.forEach(rc=>{
    const cy=rc.lane? 354:339;
    if(rc.lane===0){ g.save(); g.translate(rc.x,0); g.scale(-1,1); g.translate(-rc.x,0); }
    drawIsoCar(g,rc.x,cy,rc.car);
    if(rc.lane===0) g.restore();
  });
  /* 木（手前） */
  drawTree(g,470,120,0.85);
  /* 人 */
  const figs=[bossFig,wifeFig,...staffFigs].sort((a,b)=>a.y-b.y);
  figs.forEach(f=>drawPerson(g,f.x,f.y,f));
  visitors.forEach(c=>drawPerson(g,c.x,c.y,c));
  /* 浮き文字 */
  floats.filter(f=>f.life>0).forEach(f=>{ g.globalAlpha=Math.min(1,f.life/13); g.font='bold 13px sans-serif'; g.textAlign='center'; g.lineWidth=3.5; g.strokeStyle='#fff'; g.strokeText(f.text,f.x,f.y); g.fillStyle=f.color; g.fillText(f.text,f.x,f.y); g.globalAlpha=1; });
  g.setTransform(1,0,0,1,0,0);
}

let _panelHtml="";
function renderAll(){if(!gameState)return;renderTop();renderSpeed();renderPanel();renderGuide();}
function renderTop(){
  if(!gameState)return;
  $("tbDate").textContent="📅 "+gameState.y+"年"+gameState.m+"月"+gameState.d+"日";
  $("tbMoney").textContent="💰 "+man(gameState.money);
  $("tbPt").textContent="🔬 "+gameState.pt+" Pt";
  $("tbSold").textContent="⭐ "+storeRank()+"（売れた車 "+gameState.sold+"台）";
  const bw=$("badgeWork");
  const n=pitCount();
  bw.style.display=n?"inline-block":"none";bw.textContent=n;
}
function renderSpeed(){
  if(!gameState)return;
  for(let i=0;i<4;i++){const b=$("sp"+i);if(b)b.classList.toggle("on",gameState.speed===i);}
}
function setSpeed(n){if(!gameState)return;gameState.speed=n;renderSpeed();autoSave();}
function renderGuide(){
  const el=$("guide");if(!gameState){el.classList.add("hidden");return;}
  const texts=[
    "🚗 最初の一台はもう置いてあるよ。お客さんが来るのを待とう！「仕入れ」で車を増やすこともできるよ",
    "👀 お客さんが車を見に来たよ。商談が終わると自動で売れるかどうか決まるよ（成約率が大事！）",
    "🎉 売れた！「整備」で車を良くしたり、「配置」で飾りを置いて相性スポットを作ると、もっと売れるようになるよ"
  ];
  if(gameState.tutStep<3){el.textContent=texts[gameState.tutStep];el.classList.remove("hidden");}
  else el.classList.add("hidden");
}
function showPanel(p){
  if(p==="buy"&&marketDirty){refreshMarket();marketDirty=false;}
  curPanel=p;renderPanel();
}
function renderPanel(){
  if(!gameState)return;
  document.querySelectorAll("#nav button").forEach(function(b){b.classList.toggle("on",b.dataset.nav===curPanel);});
  const root=$("panelRoot");
  let h="";
  if(curPanel==="shop")h=shopPanel();
  else if(curPanel==="buy")h=buyPanel();
  else if(curPanel==="work")h=workPanel();
  else if(curPanel==="decor")h=decorPanel();
  else if(curPanel==="staff")h=staffPanel();
  else if(curPanel==="zukan")h=zukanPanel();
  if(h!==_panelHtml){root.innerHTML=h;_panelHtml=h;}
}

  "<span class='spec'>魅力 <b>"+(c.charm+c.customLv*CONFIG.customCharm)+"</b></span></div>";

  if(gameState.pit){
    const car=gameState.cars.find(function(c){return c.id===gameState.pit.carId;});
    const w=WORKS[gameState.pit.work];
    h+="<div class='card'><h3>🔧 ピット作業中："+(car?esc(car.name):"")+" の "+w.name+"</h3>"+

    "<p class='note'>担当："+mechName()+"（技術で速さが変わる）"+(gameState.pitQueue.length?" ／ 待ち "+gameState.pitQueue.length+"台":"")+"</p></div>";
  }else{
    h+="<p class='note'>ピットは空いています。下の車から整備を選んでね（担当："+mechName()+"）。</p>";
  }
  if(!gameState.researched.includes("custom")){
    h+="<div class='card'><h3>🔬 カスタム研究</h3><p class='note'>技術Pt "+RESEARCHES.custom.pt+" で研究すると、カスタム整備が使えるようになります（今 "+gameState.pt+" Pt）</p>"+
    "<div class='row'><button onclick='doResearch(\"custom\")' "+(gameState.pt<RESEARCHES.custom.pt?"disabled":"")+">🔬 研究する（"+RESEARCHES.custom.pt+" Pt）</button></div></div>";
  }
  if(!gameState.cars.length)h+="<p>車がありません。「仕入れ」で買ってこよう。</p>";
  gameState.cars.forEach(function(c){
    const spot=carSpot(c.id);
    const eff=spotEffects(spot,c);
    const price=carPrice(c);
    h+="<div class='card'>"+carImgHtml(c)+"<h3>"+c.maker+" "+c.name+"<span class='badge'>"+c.type+"</span><span class='badge st"+c.cond+"'>状態: "+COND_WORD[c.cond]+"</span>"+
    (c.customLv?"<span class='badge'>🎨 カスタム"+c.customLv+"</span>":"")+
    eff.combos.map(function(cb){return "<span class='badge combo'>✨ "+cb.name+"</span>";}).join("")+"</h3>"+
    specHtml(c)+
    "<div class='moneyrow'><span>相場</span><span class='v'>"+man(c.market)+"</span></div>"+
    "<div class='moneyrow'><span>売値（自動計算）</span><span class='v pricebig'>"+man(price)+"</span></div>"+
    "<p class='note'>相場 × 付け方"+(CONFIG.tierMul[c.tier])+" × 状態"+CONFIG.condMul[c.cond]+(c.customLv?" × カスタム"+(1+c.customLv*CONFIG.customMulPer).toFixed(2):"")+(eff.priceMul!==1?" × スポット"+eff.priceMul.toFixed(1):"")+" ／ 魅力 "+carCharm(c)+(c.inPit?" ／ 🔧 整備中":"")+"</p>"+
    "<div class='row'>"+
    ["安い","おすすめ","高い"].map(function(t){return "<button class='tierbtn"+(c.tier===t?" on":"")+"' onclick='setTier("+c.id+",\""+t+"\")'>"+t+"<br><span class='small'>×"+CONFIG.tierMul[t]+"</span></button>";}).join("")+
    "</div>"+
    "<div class='row' style='margin-top:6px'>"+
    Object.keys(WORKS).map(function(k){
      const w=WORKS[k];
      let dis="";
      if(c.inPit)dis="disabled";
      else if(w.research&&!gameState.researched.includes(w.research))dis="disabled";
      else if(k==="custom"&&c.customLv>=3)dis="disabled";
      else if(k==="wash"&&c.cond>=2)dis="disabled";
      else if(gameState.money<w.cost*10000)dis="disabled";
      return "<button onclick='startWork("+c.id+",\""+k+"\")' "+dis+">"+w.emoji+" "+w.name+"<br><span class='small'>"+w.cost+"万円・"+w.desc+"</span></button>";
    }).join("")+
    "</div></div>";
  });
  return h+"</div>";
}
function doResearch(key){
  if(key==="custom"){
    if(gameState.pt<RESEARCHES.custom.pt)return;
    gameState.pt-=RESEARCHES.custom.pt;
    gameState.researched.push("custom");
    news("🔬 カスタム研究が完了！カスタム整備が使えるようになったよ");
  }else{
    const d=decorById(key);if(!d)return;
    if(gameState.pt<d.pt)return;
    gameState.pt-=d.pt;
    gameState.researched.push(key);
    news("🔬 「"+d.name+"」を研究した！「配置」から置けるよ");
  }
  renderAll();autoSave();
}
function slotName(idx){
  return (idx<8?"真ん中の列":"下の列")+"・左から"+(idx%8+1)+"番目";
}
function decorPanel(){
  let h="<div class='panel'><h2>🪴 配置・お店を大きくする</h2>";
  /* 店の大きさ */
  const cur=SHOP_SIZES[gameState.shopSize];
  h+="<h3 style='margin:6px 0'>🏢 店の大きさ："+cur.name+"（展示 "+cur.cap+"台）</h3>";
  if(gameState.shopSize<SHOP_SIZES.length-1){
    const nx=SHOP_SIZES[gameState.shopSize+1];
    h+="<div class='row'><button class='primary' onclick='growShop()' "+(gameState.money<nx.cost*10000?"disabled":"")+">🏢 "+nx.name+"にする（展示 "+nx.cap+"台・"+man(nx.cost*10000)+"）</button></div>";
  }else h+="<p class='note'>いちばん大きな店です。</p>";
  /* 配置モード */
  if(placingDecor){
    const d=decorById(placingDecor);
    h+="<div class='card'><h3>"+d.emoji+" "+d.name+" を置く場所を選んでね</h3><p class='note'>車のとなり（上下）に置くと相性スポットになることがあるよ。</p><div class='slotpick'>";
    for(let i=0;i<16;i++){
      if(gameState.decors[i])continue;
      const adj=adjacentSpots(i).map(function(si){
        const dd=displayedCars().find(function(x){return x.spot===si;});
        return dd?dd.car.name:"（車なし）";
      }).join("・");
      h+="<button onclick='placeDecorAt("+i+")'>"+slotName(i)+"<br><span class='small'>となり: "+adj+"</span></button>";
    }
    h+="</div><div class='row'><button onclick='cancelPlacing()'>やめる</button></div></div>";
  }
  /* 装飾リスト */
  h+="<h3 style='margin:10px 0 6px'>🪴 飾り・設備</h3>";
  DECORS.forEach(function(d){
    const researched=gameState.researched.includes(d.id);
    const placedN=Object.keys(gameState.decors).filter(function(k){return gameState.decors[k]===d.id;}).length;
    h+="<div class='card'><h3>"+d.emoji+" "+d.name+(placedN?"<span class='badge'>"+placedN+"個 配置中</span>":"")+"</h3>"+
    "<p class='note'>"+d.desc+" ／ 清潔感+"+d.clean+"</p>";
    if(!researched){
      h+="<div class='row'><button onclick='doResearch(\""+d.id+"\")' "+(gameState.pt<d.pt?"disabled":"")+">🔬 研究する（"+d.pt+" Pt・今 "+gameState.pt+" Pt）</button></div>";
    }else{
      h+="<div class='row'><button class='good' onclick='startPlacing(\""+d.id+"\")' "+(gameState.money<d.cost*10000?"disabled":"")+">🪴 置く（"+d.cost+"万円）</button></div>";
    }
    h+="</div>";
  });
  /* 配置済み */
  const placed=Object.keys(gameState.decors);
  if(placed.length){
    h+="<h3 style='margin:10px 0 6px'>置いてあるもの</h3>";
    placed.forEach(function(k){
      const d=decorById(gameState.decors[k]);
      h+="<div class='moneyrow'><span>"+(d?d.emoji+" "+d.name:"")+"（"+slotName(Number(k))+"）</span><button onclick='removeDecor("+k+")'>はずす</button></div>";
    });
  }
  h+="<p class='note'>相性スポット例：スポーツ車＋のぼり旗、ボロ車＋洗車機、高級車＋観葉植物…。見つけると図鑑に登録されるよ。</p></div>";
  return h;
}
function growShop(){
  const nx=SHOP_SIZES[gameState.shopSize+1];if(!nx)return;
  if(gameState.money<nx.cost*10000)return;
  gameState.money-=nx.cost*10000;
  gameState.shopSize++;
  news("🏢 お店が「"+nx.name+"」になりました！展示できる車が "+nx.cap+"台に増えたよ");
  renderAll();autoSave();
}
function startPlacing(id){placingDecor=id;renderPanel();}
function cancelPlacing(){placingDecor=null;renderPanel();}
function placeDecorAt(idx){
  const d=decorById(placingDecor);if(!d)return;
  if(gameState.decors[idx])return;
  if(gameState.money<d.cost*10000){news("💦 お金が足りません");return;}
  gameState.money-=d.cost*10000;
  gameState.decors[idx]=d.id;
  placingDecor=null;
  news(d.emoji+" "+d.name+" を置きました");
  checkCombos();
  renderAll();autoSave();
}
function removeDecor(idx){
  delete gameState.decors[idx];
  renderAll();autoSave();
}
function staffPanel(){
  let h="<div class='panel'><h2>👥 仲間</h2>"+
  "<div class='card'><h3>🧑‍💼 社長（あなた）<span class='rankchip' style='background:"+RANK_COLOR[bossRank()]+"'>営業 "+bossRank()+"</span></h3>"+
  "<p class='note'>話術 +"+(CONFIG.talkBonus[bossRank()])+" ／ 売った台数でランクアップ。整備も手伝います。</p></div>";
  if(!gameState.staff.length)h+="<p class='note'>まだ仲間がいません。下の候補から雇えます（最大"+CONFIG.maxStaff+"人）。営業は商談を手伝い、整備士はピット作業が速くなります。</p>";
  gameState.staff.forEach(function(s){
    h+="<div class='card'><h3>"+(s.role==="mech"?"🔧":"💼")+" "+esc(s.name)+"<span class='rankchip' style='background:"+RANK_COLOR[s.rank]+"'>"+s.rank+"</span><span class='badge'>"+(s.role==="mech"?"整備":"営業")+"</span></h3>"+
    "<div class='moneyrow'><span>給料</span><span class='v'>"+man(s.salary*10000)+" / 月</span></div>"+
    "<p class='note'>"+(s.role==="mech"?("技術 ×"+CONFIG.mechFactor[s.rank]+"（作業が速い）"):("話術 +"+CONFIG.talkBonus[s.rank]+"（成約率アップ）"))+"</p>"+
    "<div class='row'><button class='danger' onclick='fireStaff("+s.id+")'>やめてもらう</button></div></div>";
  });
  h+="<h3 style='margin:10px 0 6px'>雇える人（毎月 入れ替わります）</h3>";
  if(gameState.staff.length>=CONFIG.maxStaff)h+="<p class='note'>仲間はいっぱいです。</p>";
  gameState.candidates.forEach(function(c){
    h+="<div class='card'><h3>"+(c.role==="mech"?"🔧":"💼")+" "+esc(c.name)+"<span class='rankchip' style='background:"+RANK_COLOR[c.rank]+"'>"+c.rank+"</span><span class='badge'>"+(c.role==="mech"?"整備":"営業")+"</span></h3>"+
    "<div class='moneyrow'><span>給料</span><span class='v'>"+man(c.salary*10000)+" / 月</span></div>"+
    "<div class='row'><button class='good' onclick='hireStaff("+c.id+")' "+(gameState.staff.length>=CONFIG.maxStaff?"disabled":"")+">🤝 雇う</button></div></div>";
  });
  return h+"</div>";
}
function hireStaff(id){
  const idx=gameState.candidates.findIndex(function(c){return c.id===id;});
  if(idx<0||gameState.staff.length>=CONFIG.maxStaff)return;
  const c=gameState.candidates[idx];
  gameState.staff.push(c);
  gameState.candidates.splice(idx,1);
  syncStaffFigs();
  news("🤝 "+c.name+"さん（"+(c.role==="mech"?"整備":"営業")+"・ランク"+c.rank+"）が仲間になりました");
  renderAll();autoSave();
}
function fireStaff(id){
  gameState.staff=gameState.staff.filter(function(s){return s.id!==id;});
  syncStaffFigs();
  renderAll();autoSave();
}
function zukanPanel(){
  const gotCars=Object.keys(gameState.zukanCars).length;
  let h="<div class='panel'><h2>📖 図鑑</h2>"+
  "<h3 style='margin:6px 0'>🚗 車種図鑑（"+gotCars+" / 61種）</h3><p class='note'>売れた車が登録されます。</p>";
  TYPES.forEach(function(t){
    h+="<p style='margin:8px 0 4px'><b>"+t+"</b></p><div class='zukan-grid'>";
    MODELS[t].forEach(function(md){
      const got=gameState.zukanCars[md[1]];
      h+="<div class='zukan-cell"+(got?"":" undiscovered")+"'>"+(got?md[0]+" "+md[1]:"？？？")+"</div>";
    });
    h+="</div>";
  });
  h+="<h3 style='margin:14px 0 6px'>✨ 相性スポット図鑑（"+Object.keys(gameState.zukanSpots).length+" / "+COMBOS.length+"）</h3>";
  COMBOS.forEach(function(cb){
    const got=gameState.zukanSpots[cb.id];
    const d=decorById(cb.decor);
    h+="<div class='card'><h3>"+(got?"✨ "+cb.name:"？？？スポット")+"</h3><p class='note'>"+(got?cb.desc:("ヒント： "+(d?d.emoji+" "+d.name:"")+" のとなりがカギ"))+"</p></div>";
  });
  return h+"</div>";
}
function renameShop(){
  const name=prompt("新しい店の名前を入れてね（12文字まで）",gameState.shopName);
  if(name===null)return;
  const nm=name.trim().slice(0,12);
  if(!nm)return;
  gameState.shopName=nm;news("🏠 店の名前を「"+nm+"」に変えました");renderAll();autoSave();
}

/* ================================================================
   タイトル画面・起動
   ================================================================ */
let pendingSlot=-1;
let askCb=null;
function askConfirm(msg,cb){
  $("askBody").innerHTML="<p style='font-size:16px'>"+msg+"</p>";
  askCb=cb;openModal("askModal");
}
function askYes(){closeModal("askModal");if(askCb){const cb=askCb;askCb=null;cb();}}
function showTitle(){
  $("gameScreen").classList.add("hidden");
  $("titleScreen").classList.add("open");
  $("nameBox").style.display="none";
  let h="";
  for(let i=0;i<3;i++){
    const s=loadSlot(i);
    h+="<div class='slot'><h3>📁 データ"+(i+1)+"</h3>";
    if(s){
      h+="<p style='margin:0 0 8px'>🏠 <b>"+esc(s.shopName)+"</b><br><span class='small'>"+s.y+"年"+s.m+"月"+s.d+"日 ／ 💰 "+man(s.money)+" ／ 🎉 売れた車 "+s.sold+"台 ／ ⭐ "+(()=>{const save=gameState;gameState=s;const r=storeRank();gameState=save;return r;})()+"</span></p>"+
      "<div class='row'><button class='primary' onclick='continueGame("+i+")'>▶ つづきから</button>"+
      "<button onclick='askNewGame("+i+")'>🆕 新しくはじめる</button>"+
      "<button class='danger' onclick='askDelete("+i+")'>🗑 消す</button></div>";
    }else{
      h+="<p class='small' style='margin:0 0 8px'>（まだデータがありません）</p>"+
      "<div class='row'><button class='primary' onclick='askNewGame("+i+")'>🆕 新しくはじめる</button></div>";
    }
    h+="</div>";
  }
  $("slotList").innerHTML=h;
}
function askNewGame(i){
  const s=loadSlot(i);
  if(s){
    askConfirm("データ"+(i+1)+"には「"+esc(s.shopName)+"」の記録があります。<br>消して新しくはじめますか？",function(){openNameBox(i);});
  }else openNameBox(i);
}
function askDelete(i){
  askConfirm("データ"+(i+1)+"を消しますか？（もとに戻せません）",function(){
    LS.del(SAVE_KEYS[i]);showTitle();
  });
}
function openNameBox(i){
  pendingSlot=i;
  $("nameBox").style.display="block";
  $("shopNameInput").value="";
  $("nameBox").scrollIntoView({behavior:"smooth",block:"center"});
}
function cancelNewGame(){$("nameBox").style.display="none";pendingSlot=-1;}
function confirmNewGame(){
  const nm=($("shopNameInput").value||"").trim().slice(0,12)||"さくらモータース";
  curSlot=pendingSlot<0?0:pendingSlot;
  gameState=defaultState(nm);
  const first=genCar();
  gameState.cars.push(first);
  refreshMarket();
  ensurePlan();
  genCandidates();
  visitors=[];staffFigs=[];floats=[];
  bossFig.mode="idle";bossFig.x=BOSS_HOME.x;bossFig.y=BOSS_HOME.y;bossFig.tx=BOSS_HOME.x;bossFig.ty=BOSS_HOME.y;
  news("🚗 お店を開きました！最初の一台「"+first.name+"」を置いておいたよ");
  enterGame();
}
function continueGame(i){
  const s=loadSlot(i);
  if(!s)return;
  curSlot=i;gameState=s;
  visitors=[];staffFigs=[];floats=[];
  syncStaffFigs();
  ensurePlan();
  if(!gameState.candidates||!gameState.candidates.length)genCandidates();
  bossFig.mode="idle";bossFig.x=BOSS_HOME.x;bossFig.y=BOSS_HOME.y;bossFig.tx=BOSS_HOME.x;bossFig.ty=BOSS_HOME.y;
  news(gameState.log||"🚗 お店を開きました！");
  enterGame();
}
function enterGame(){
  $("titleScreen").classList.remove("open");
  $("gameScreen").classList.remove("hidden");
  curPanel="shop";_panelHtml="";renderAll();
  autoSave();
}
function backToTitle(){autoSave();showTitle();}

/* ================= メインループ（描画と時間進行を分離） ================= */
let _lastT=0,_acc=0;
function logicTick(){
  if(!gameState)return;
  dayCarry++;
  if(dayCarry>=CONFIG.ticksPerDay){dayCarry=0;nextDay();}
  tickCustomers();
  tickFigs();
  tickPit();
  tickRoad();
  floats.forEach(function(fl){fl.y-=0.7;fl.life--;});
}
function frameLoop(ts){
  requestAnimationFrame(frameLoop);
  if(!_lastT)_lastT=ts;
  const dt=Math.min(250,ts-_lastT);_lastT=ts;
  if(!gameState||$("gameScreen").classList.contains("hidden"))return;
  _acc+=dt/CONFIG.tickMs*(gameState.speed||0);
  let n=0;
  while(_acc>=1&&n<14){logicTick();_acc--;n++;}
  if(_acc>14)_acc=0;
  drawScene();
}
requestAnimationFrame(frameLoop);
showTitle();

</script>
