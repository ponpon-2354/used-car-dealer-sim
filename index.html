<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>中古車販売店ゲーム</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif;background:#dff3e4;color:#4a3b2a;font-size:15px}
button{font-family:inherit;cursor:pointer;border:2px solid #b08954;border-radius:12px;background:#fffdf5;color:#4a3b2a;padding:8px 12px;font-size:15px;touch-action:manipulation;-webkit-tap-highlight-color:rgba(0,0,0,.08)}
button:active{transform:translateY(1px)}
button:disabled{opacity:.45;cursor:default}
button.good{background:#57b368;border-color:#3d8b4f;color:#fff;font-weight:bold}
button.primary{background:#ffb52e;border-color:#d18f12;color:#5a3d00;font-weight:bold}
button.danger{background:#e86a5e;border-color:#c24a3e;color:#fff}
input[type=text]{font-family:inherit;font-size:17px;padding:10px;border:2px solid #b08954;border-radius:10px;width:100%}
/* 上のバー */
#topbar{position:sticky;top:0;z-index:30;background:#fff8e6;border-bottom:3px solid #e5c98c;display:flex;justify-content:space-between;align-items:center;padding:8px 12px;gap:8px}
#topbar .date{font-weight:bold;font-size:15px}
#topbar .money{font-weight:bold;font-size:19px;color:#b97a00}
#topbar .sold{font-size:13px;color:#7a6a55}
/* メイン */
#main{max-width:640px;margin:0 auto;padding:8px 8px 96px}
#cvWrap{background:#c3d2cf;border:3px solid #8a9a8c;border-radius:16px;overflow:hidden}
canvas#cv{display:block;width:100%;aspect-ratio:480/270}
/* 下のナビ */
#nav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:#fff8e6;border-top:3px solid #e5c98c;display:flex;gap:6px;padding:8px;max-width:640px;margin:0 auto}
#nav button{flex:1;font-size:15px;font-weight:bold;padding:12px 2px;border-radius:14px;background:#fffdf5}
#nav button.on{background:#ffb52e;border-color:#d18f12;color:#5a3d00}
#nav .badge-n{display:inline-block;background:#e86a5e;color:#fff;border-radius:999px;font-size:11px;padding:0 6px;margin-left:2px}
/* パネル */
.panel{background:#fffdf5;border:3px solid #e5c98c;border-radius:16px;padding:12px;margin-top:10px}
.panel h2{margin:2px 0 10px;font-size:18px}
.small{font-size:13px;color:#7a6a55}
.note{font-size:13px;color:#7a6a55;margin:6px 0}
/* カード */
.card{background:#fff;border:2px solid #ecd9ae;border-radius:14px;padding:10px;margin-bottom:10px}
.card h3{margin:0 0 6px;font-size:17px}
.carimg{display:block;width:100%;max-width:300px;height:auto;margin:0 auto 6px}
.carimg-big{max-width:330px;margin:8px auto}
.badge{display:inline-block;background:#eef4ff;border:1.5px solid #9db8dd;color:#33507e;border-radius:999px;font-size:12px;padding:1px 8px;margin-left:4px;vertical-align:middle}
.badge.st0{background:#fdeceb;border-color:#e0a49d;color:#8c3a30}
.badge.st1{background:#fff6da;border-color:#dec26a;color:#7a5c00}
.badge.st2{background:#e6f7e6;border-color:#7cc47f;color:#256b27}
.specrow{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.spec{background:#faf3df;border-radius:10px;padding:5px 10px;font-size:14px}
.spec b{font-size:15px}
.moneyrow{display:flex;justify-content:space-between;padding:3px 0;font-size:15px}
.moneyrow .v{font-weight:bold}
.pricebig{font-size:24px;font-weight:bold;color:#b97a00}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row button{flex:1;min-height:48px}
.tierbtn.on{background:#ffb52e;border-color:#d18f12;color:#5a3d00;font-weight:bold}
/* 案内バー・お知らせ */
.prep-banner{background:#fff3c9;border:3px solid #f0b429;border-radius:14px;padding:12px;font-size:16px;text-align:center;line-height:1.6;margin-bottom:10px}
#guide{background:#fff3c9;border:3px solid #f0b429;border-radius:14px;padding:10px 12px;margin-top:10px;font-size:16px}
#news{background:#eef7ee;border:2px solid #bcd8bc;border-radius:12px;padding:8px 12px;margin-top:10px;font-size:14px;min-height:20px}
#waitInfo .waitbox{background:#ffe9e4;border:3px solid #e86a5e;border-radius:14px;padding:10px 12px;margin-top:10px}
/* 時間ボタン */
#speedRow{display:flex;gap:6px;margin-top:8px}
#speedRow button{flex:1;padding:8px}
#speedRow button.on{background:#57b368;border-color:#3d8b4f;color:#fff;font-weight:bold}
/* モーダル */
.modal{position:fixed;inset:0;background:rgba(60,45,20,.55);display:none;z-index:100;align-items:flex-start;justify-content:center;overflow-y:auto;padding:14px 8px}
.modal.open{display:flex}
.mbox{background:#fffdf5;border:3px solid #b08954;border-radius:18px;max-width:520px;width:100%;padding:16px;margin:auto}
.mbox h2{margin:0 0 10px;font-size:20px}
/* バトル */
.hpbar{background:#eee0c0;border:2px solid #b08954;border-radius:999px;height:22px;overflow:hidden;margin:6px 0}
.hpbar i{display:block;height:100%;background:linear-gradient(#7ed37e,#43a047);transition:width .3s}
.battle-price{font-size:34px;font-weight:bold;color:#b97a00;text-align:center;margin:8px 0}
#battleLast{background:#faf3df;border-radius:10px;padding:8px 10px;min-height:22px;font-size:15px;margin:8px 0}
.rankbig{font-size:30px;font-weight:bold;vertical-align:middle}
.rankchip{display:inline-block;min-width:26px;text-align:center;border-radius:8px;color:#fff;font-weight:bold;padding:2px 6px}
/* タイトル画面 */
#titleScreen{position:fixed;inset:0;z-index:200;background:linear-gradient(#aee3f9 0%,#d8f5e3 55%,#fdf6da 100%);overflow-y:auto;display:none}
#titleScreen.open{display:block}
.title-inner{max-width:520px;margin:0 auto;padding:28px 14px 40px;text-align:center}
.title-inner h1{font-size:30px;margin:8px 0 4px;color:#7a4d00;text-shadow:0 2px 0 #fff}
.cloud{font-size:34px;letter-spacing:12px}
.slot{background:#fffdf5;border:3px solid #e5c98c;border-radius:16px;padding:12px;margin:12px 0;text-align:left}
.slot h3{margin:0 0 6px;font-size:17px}
.slot .row button{min-height:52px;font-size:16px}
#nameBox{background:#fffdf5;border:3px solid #f0b429;border-radius:16px;padding:14px;margin:12px 0;text-align:left;display:none}
.hidden{display:none!important}
.rankpop{font-size:44px;text-align:center}
</style>
</head>
<body>

<!-- タイトル画面 -->
<div id="titleScreen">
  <div class="title-inner">
    <div class="cloud">☁️ ☁️ ☁️</div>
    <div style="font-size:52px">🚗</div>
    <h1>中古車販売店</h1>
    <p style="margin:0 0 6px;font-weight:bold;color:#5b7a4a">経営シミュレーション</p>
    <p class="small">お店の名前を決めて、車を買って、キレイにして、売ろう！</p>
    <div id="slotList"></div>
    <div id="nameBox">
      <p style="margin:0 0 8px"><b>お店の名前を決めてね</b>（12文字まで）<br><span class="small">看板にその名前が出るよ。あとから「お店」の画面で変えることもできるよ。</span></p>
      <input type="text" id="shopNameInput" maxlength="12" placeholder="例: さくらモータース">
      <div class="row" style="margin-top:10px">
        <button class="primary" style="min-height:52px" onclick="confirmNewGame()">🚗 お店をはじめる！</button>
        <button onclick="cancelNewGame()">やめる</button>
      </div>
    </div>
  </div>
</div>

<!-- ゲーム画面 -->
<div id="gameScreen" class="hidden">
  <div id="topbar">
    <span class="date" id="tbDate">----</span>
    <span class="money" id="tbMoney">💰 ---万円</span>
    <span class="sold" id="tbSold">🎉 売れた車 0台</span>
  </div>
  <div id="main">
    <div id="cvWrap"><canvas id="cv" width="960" height="540"></canvas></div>
    <div id="speedRow">
      <button id="sp0" onclick="setSpeed(0)">⏸ 止める</button>
      <button id="sp1" onclick="setSpeed(1)">▶ ふつう</button>
      <button id="sp2" onclick="setSpeed(2)">⏩ 早い</button>
    </div>
    <div id="waitInfo"></div>
    <div id="guide" class="hidden"></div>
    <div id="news">🚗 お店を開きました！</div>
    <div id="panelRoot"></div>
  </div>
  <div id="nav">
    <button data-nav="shop" onclick="showPanel('shop')">🏠 店</button>
    <button data-nav="buy" onclick="showPanel('buy')">🚗 車を買う</button>
    <button data-nav="cars" onclick="showPanel('cars')">🚙 車<span class="badge-n" id="badgeCars" style="display:none"></span></button>
    <button data-nav="staff" onclick="showPanel('staff')">👥 仲間</button>
    <button data-nav="grow" onclick="showPanel('grow')">🏢 大きくする</button>
  </div>
</div>

<!-- バトル -->
<div class="modal" id="battleModal"><div class="mbox">
  <h2>🎲 サイコロバトル！</h2>
  <div id="battleBody"></div>
</div></div>

<!-- 今月のまとめ -->
<div class="modal" id="monthModal"><div class="mbox">
  <h2>📅 今月のまとめ</h2>
  <div id="monthBody"></div>
  <div class="row" style="margin-top:12px"><button class="primary" style="min-height:52px" onclick="closeMonth()">わかった！</button></div>
</div></div>

<!-- お知らせポップアップ -->
<div class="modal" id="popModal"><div class="mbox">
  <div id="popBody"></div>
  <div class="row" style="margin-top:12px"><button class="primary" style="min-height:52px" onclick="closeModal('popModal')">わかった！</button></div>
</div></div>

<!-- 上書き確認（タイトル画面より前に出す） -->
<div class="modal" id="askModal" style="z-index:300"><div class="mbox">
  <div id="askBody"></div>
  <div class="row" style="margin-top:12px">
    <button style="min-height:52px" onclick="closeModal('askModal')">やめる</button>
    <button class="primary" style="min-height:52px" onclick="askYes()">はい、はじめる</button>
  </div>
</div></div>

<!-- ゲームオーバー -->
<div class="modal" id="overModal"><div class="mbox">
  <h2>💦 お店が続けられなくなりました…</h2>
  <div id="overBody"></div>
  <div class="row" style="margin-top:12px"><button class="primary" style="min-height:52px" onclick="gameOverToTitle()">タイトルに戻る</button></div>
</div></div>

<script>
"use strict";
/* ================= 便利な関数 ================= */
function $(id){return document.getElementById(id);}
function ri(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function rnd(a,b){return a+Math.random()*(b-a);}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
/* お金は万円で表示（細かい数字は出さない） */
function man(yen){const m=yen/10000;const s=(Math.round(m*10)/10).toLocaleString("ja-JP",{maximumFractionDigits:1});return s+"万円";}
/* 走行は万km・小数1桁だけ */
function manKm(km){return (Math.round(km/1000)/10).toLocaleString("ja-JP",{maximumFractionDigits:1})+"万km";}

/* ================= セーブ（例外が出ても止まらない仕組み） ================= */
const LS={
  mem:{},
  get(k){try{return window.localStorage.getItem(k);}catch(e){return (k in this.mem)?this.mem[k]:null;}},
  set(k,v){try{window.localStorage.setItem(k,v);}catch(e){this.mem[k]=v;}},
  del(k){try{window.localStorage.removeItem(k);}catch(e){delete this.mem[k];}}
};
const SAVE_KEYS=["ponpoko_usedcar_slot1","ponpoko_usedcar_slot2","ponpoko_usedcar_slot3"];

/* ================= データ ================= */
const TYPES=["軽","コンパクト","セダン","SUV","ミニバン","スポーツ"];
const MODELS={
  "軽":[["ホンダ","N-BOX",150],["ダイハツ","タント",140],["スズキ","ハスラー",135],["ダイハツ","ムーヴ",110],["スズキ","ワゴンR",100],["ホンダ","N-ONE",130],["スズキ","スペーシア",140],["スズキ","ジムニー",180],["ダイハツ","タフト",150],["日産","デイズ",100],["ホンダ","N-WGN",120],["ダイハツ","キャスト",120],["スズキ","アルト",80],["スズキ","エブリイ",110],["ダイハツ","ハイゼットカーゴ",100],["三菱","eKワゴン",90],["日産","ルークス",140],["ダイハツ","ムーヴキャンバス",130],["ホンダ","N-VAN",150],["三菱","デリカミニ",160],["ダイハツ","ミライース",90]],
  "コンパクト":[["トヨタ","ヤリス",170],["ホンダ","フィット",160],["日産","ノート",155],["スズキ","スイフト",150],["トヨタ","アクア",150],["トヨタ","ルーミー",160],["スズキ","ソリオ",140],["ダイハツ","パッソ",110]],
  "セダン":[["トヨタ","プリウス",240],["トヨタ","カローラ",210],["ホンダ","アコード",260],["マツダ","MAZDA3",200],["トヨタ","クラウン",380],["トヨタ","カムリ",280],["日産","スカイライン",320],["トヨタ","マークX",180]],
  "SUV":[["スバル","フォレスター",280],["トヨタ","RAV4",300],["ホンダ","ヴェゼル",240],["マツダ","CX-5",260],["トヨタ","ハリアー",320],["日産","エクストレイル",260],["トヨタ","ランドクルーザー",550],["トヨタ","C-HR",230]],
  "ミニバン":[["ホンダ","ステップワゴン",290],["トヨタ","ノア",280],["日産","セレナ",270],["ホンダ","フリード",230],["トヨタ","アルファード",450],["トヨタ","ヴォクシー",300],["ホンダ","オデッセイ",280],["三菱","デリカD:5",330]],
  "スポーツ":[["トヨタ","GR86",320],["マツダ","ロードスター",260],["スバル","BRZ",310],["日産","フェアレディZ",450],["トヨタ","スープラ",550],["日産","GT-R",1200],["ホンダ","シビック TYPE R",480],["スバル","WRX",350]]
};
const COLORS=["レッド","ブルー","ホワイト","ブラック","シルバー","イエロー","グリーン","オレンジ","パープル","ベージュ"];
/* 車種ごとの本当の色（写真イラストの色で固定。色違いはなし） */
const MODEL_COLOR={"N-BOX":"ホワイト","タント":"ブルー","ハスラー":"オレンジ","ムーヴ":"ブルー","ワゴンR":"イエロー","N-ONE":"レッド","スペーシア":"ブルー","ジムニー":"イエロー","タフト":"オレンジ","デイズ":"オレンジ","N-WGN":"ホワイト","キャスト":"レッド","アルト":"レッド","エブリイ":"ホワイト","ハイゼットカーゴ":"ベージュ","eKワゴン":"パープル","ルークス":"レッド","ムーヴキャンバス":"グリーン","N-VAN":"シルバー","デリカミニ":"グリーン","ミライース":"イエロー","ヤリス":"レッド","フィット":"レッド","ノート":"ブルー","スイフト":"レッド","アクア":"ブルー","ルーミー":"レッド","ソリオ":"レッド","パッソ":"ベージュ","プリウス":"レッド","カローラ":"ホワイト","アコード":"レッド","MAZDA3":"レッド","クラウン":"シルバー","カムリ":"ホワイト","スカイライン":"ブルー","マークX":"ブラック","フォレスター":"グリーン","RAV4":"ホワイト","ヴェゼル":"レッド","CX-5":"レッド","ハリアー":"レッド","エクストレイル":"レッド","ランドクルーザー":"ベージュ","C-HR":"シルバー","ステップワゴン":"ブルー","ノア":"ホワイト","セレナ":"シルバー","フリード":"シルバー","アルファード":"ベージュ","ヴォクシー":"ブルー","オデッセイ":"ブルー","デリカD:5":"シルバー","GR86":"ブラック","ロードスター":"レッド","BRZ":"ブルー","フェアレディZ":"ブルー","スープラ":"シルバー","GT-R":"ブルー","シビック TYPE R":"ホワイト","WRX":"ブルー"};
const CAR_PAINT={"レッド":"#e5533d","ブルー":"#3d7de0","ホワイト":"#f4f6f8","ブラック":"#3a3f4a","シルバー":"#c9ced6","イエロー":"#f2c230","グリーン":"#57b368","オレンジ":"#f08a2e","パープル":"#9a6ad8","ベージュ":"#e3d3ae"};
const FIRST=["健太","美咲","翔太","結衣","大輔","恵子","直樹","千尋","浩二","誠","陽子","隆","さくら","悠真","葵","蓮"];
const LAST=["佐藤","鈴木","高橋","田中","伊藤","渡辺","山本","中村","小林","加藤","吉田","松本"];
const STAFF_NAMES=["タロウ","ハナコ","ジロウ","ユキ","ケンジ","ミキ","ショウ","アヤ","ダイチ","リン","ソラ","メイ"];
const COND_WORD=["いまいち","ふつう","ピカピカ"];
const RANKS=["F","E","D","C","B","A","S"];
const RANK_COLOR={"F":"#9aa0a6","E":"#5b8def","D":"#3aa655","C":"#e0a400","B":"#f08a2e","A":"#e5533d","S":"#d4a017"};
/* サイコロの出やすさ（1〜6の重み）。ランクが上がるほど いい目が出やすい */
const DICE_W={"F":[1,1,1,1,1,1],"E":[7,7,9,9,9,9],"D":[1,1,2,2,2,2],"C":[2,2,9,9,9,9],"B":[0,0,1,1,1,1],"A":[0,0,2,2,3,3],"S":[0,0,1,1,4,4]};
const DICE_FACE=["⚀","⚁","⚂","⚃","⚄","⚅"];
const RANK_SALARY={"F":12,"E":15,"D":18,"C":22,"B":28,"A":36,"S":48}; /* 万円/月 */
const BOSS_RANK_SALES=[0,3,8,15,25,40,60]; /* この台数売るとランクが上がる */
const SHOP_SIZES=[
  {name:"小さい店",cap:6,cost:0},
  {name:"中くらいの店",cap:10,cost:500},
  {name:"大きな店",cap:16,cost:1500}
]; /* cost は万円 */

/* ================= ゲームの状態 ================= */
let S=null;
let curSlot=0;
let curPanel="shop";
let B=null; /* バトル中 */
let people=[]; /* 歩く人 */
let visitors=[]; /* 来客データ */
let waitQueue=[]; /* 待っているお客さん */
let dayCarry=0; /* 時間の進み具合 */

function newState(shopName){
  return {
    ver:2, shopName:shopName,
    y:2026, m:4, d:1, days:0,
    money:1000*10000, sold:0,
    shopSize:0,
    cars:[], nextId:1,
    market:[], /* 今日買える車 */
    staff:[], candidates:[],
    bossExp:0, rescued:false, over:false,
    plan:null, opened:false, /* 来客計画と開業済みフラグ */
    month:{sold:0,income:0,expense:0},
    speed:1, tut:-1, /* -1:終わった/やらない, 0〜3:ステップ */
    log:"🚗 お店を開きました！"
  };
}
function bossRankIdx(){let r=0;for(let i=0;i<BOSS_RANK_SALES.length;i++){if(S.bossExp>=BOSS_RANK_SALES[i])r=i;}return r;}
function bossRank(){return RANKS[bossRankIdx()];}
function capacity(){return S.cars.length<SHOP_SIZES[S.shopSize].cap;}
function serveCap(){return 1+S.staff.length;}
function saveKey(){return SAVE_KEYS[curSlot];}
function autoSave(){if(!S)return;try{LS.set(saveKey(),JSON.stringify(S));}catch(e){}}
function readSlot(i){
  try{const raw=LS.get(SAVE_KEYS[i]);if(!raw)return null;const o=JSON.parse(raw);if(!o||o.ver!==2)return null;return normalizeSave(o);}catch(e){return null;}
}
/* 昔のセーブに新しい項目を補う */
function normalizeSave(o){
  if(o.plan===undefined)o.plan=null;
  if(o.plan&&o.plan.spawned===undefined)o.plan.spawned=o.plan.days.filter(function(d){return d<o.d;}).length;
  if(o.opened===undefined)o.opened=(o.y*12+o.m)>=(2026*12+6);
  /* 色は車種ごとの本当の色にそろえる（色違い廃止にともなう移行） */
  const fixColor=function(c){if(c&&MODEL_COLOR[c.name])c.color=MODEL_COLOR[c.name];};
  (o.cars||[]).forEach(fixColor);
  (o.market||[]).forEach(fixColor);
  return o;
}

/* ================= タイトル画面 ================= */
let pendingSlot=-1;
function showTitle(){
  S=null;B=null;waitQueue=[];visitors=[];people=[];
  $("gameScreen").classList.add("hidden");
  $("titleScreen").classList.add("open");
  renderSlots();
}
function renderSlots(){
  let html="";
  for(let i=0;i<3;i++){
    const s=readSlot(i);
    html+="<div class='slot'><h3>📁 データ"+(i+1)+"</h3>";
    if(s){
      html+="<div>🏠 <b>"+esc(s.shopName)+"</b></div>"+
        "<div>📅 "+s.y+"年"+s.m+"月"+s.d+"日　💰 お金 "+man(s.money)+"</div>"+
        "<div>🎉 売れた車 "+s.sold+"台</div>"+
        "<div class='row' style='margin-top:8px'><button class='good' onclick='loadGame("+i+")'>▶ つづきからはじめる</button>"+
        "<button onclick='askNewGame("+i+",true)'>新しくはじめる</button></div>";
    }else{
      html+="<div class='small'>あき（データなし）</div>"+
        "<div class='row' style='margin-top:8px'><button class='primary' onclick='askNewGame("+i+",false)'>▶ ここではじめる</button></div>";
    }
    html+="</div>";
  }
  $("slotList").innerHTML=html;
}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
let askCb=null;
function askNewGame(i,hasData){
  if(hasData){
    /* ブラウザ標準の confirm は環境によって出ないことがあるので、ゲーム内の窓で聞く */
    pendingSlot=i;
    $("askBody").innerHTML="<p style='text-align:center;font-size:17px'>前のデータは消えます。<br>本当にいいですか？</p>";
    askCb=function(){showNameBox();};
    openModal("askModal");
    return;
  }
  pendingSlot=i;
  showNameBox();
}
function showNameBox(){
  $("shopNameInput").value="";
  $("nameBox").style.display="block";
  $("shopNameInput").focus();
}
function askYes(){closeModal("askModal");if(askCb){const f=askCb;askCb=null;f();}}
function cancelNewGame(){pendingSlot=-1;$("nameBox").style.display="none";}
function confirmNewGame(){
  if(pendingSlot<0)return;
  let name=($("shopNameInput").value||"").trim().slice(0,12);
  if(!name)name="さくらモータース";
  curSlot=pendingSlot;pendingSlot=-1;
  $("nameBox").style.display="none";
  S=newState(name);
  S.tut=0;
  refreshMarket();
  refreshCandidates();
  enterGame();
  autoSave();
}
function loadGame(i){
  const s=readSlot(i);
  if(!s)return;
  curSlot=i;S=s;
  ensurePlan();
  B=null;waitQueue=[];visitors=[];people=makePeople();
  enterGame();
}
function enterGame(){
  $("titleScreen").classList.remove("open");
  $("gameScreen").classList.remove("hidden");
  curPanel="shop";
  if(!people.length)people=makePeople();
  renderAll();
  updateGuide();
}
function backToTitle(){autoSave();showTitle();}
function renameShop(){
  if(!S)return;
  const name=prompt("新しい店の名前を入れてね（12文字まで）",S.shopName);
  if(name===null)return;
  const nm=name.trim().slice(0,12);
  if(!nm)return;
  S.shopName=nm;news("🏠 店の名前を「"+nm+"」に変えました");renderAll();autoSave();
}
</script>

<script>
/* ================= 車を作る ================= */
function genCar(){
  const type=pick(TYPES);
  const md=pick(MODELS[type]);
  const age=ri(0,8);
  const year=2026-age;
  const km=ri(5,120)*1000;
  const cond=pick([0,0,1,1,1,2]);
  let market=md[2]*10000*Math.pow(0.92,age)*(1-clamp(km/1000,0,120)/100*0.45)*(0.85+cond*0.12);
  market=Math.max(15*10000,Math.round(market/10000)*10000);
  return {id:S.nextId++,maker:md[0],name:md[1],type:type,year:year,km:km,cond:cond,color:MODEL_COLOR[md[1]]||"ホワイト",market:market,price:0,tier:"おすすめ"};
}
function tierPrice(car){
  const r=car.tier==="安い"?0.95:(car.tier==="高い"?1.25:1.1);
  return Math.round(car.market*r/10000)*10000;
}
function refreshMarket(){
  S.market=[];
  for(let i=0;i<4;i++){
    const c=genCar();
    c.buyPrice=Math.round(c.market*rnd(0.75,0.9)/10000)*10000;
    S.market.push(c);
  }
}

/* ================= 車を買う ================= */
function buyCar(id){
  const idx=S.market.findIndex(c=>c.id===id);
  if(idx<0)return;
  const c=S.market[idx];
  if(!capacity()){news("🚙 置ける場所がいっぱいです。「大きくする」で店を大きくしよう");return;}
  if(S.money<c.buyPrice){news("💦 お金が足りません");return;}
  S.money-=c.buyPrice;S.month.expense+=c.buyPrice;
  S.market.splice(idx,1);
  const car={id:c.id,maker:c.maker,name:c.name,type:c.type,year:c.year,km:c.km,cond:c.cond,color:c.color,market:c.market,tier:"おすすめ",price:0,buyPrice:c.buyPrice,cleaned:false};
  car.price=tierPrice(car);
  S.cars.push(car);
  news("🚗 "+car.maker+" "+car.name+" を買いました！");
  if(S.tut===0){S.tut=1;}
  checkMoney();renderAll();updateGuide();autoSave();
}
/* ================= キレイにする ================= */
function cleanCost(car){return Math.max(1*10000,Math.round(car.market*(car.cond===0?0.12:0.06)/10000)*10000);}
function cleanCar(id){
  const car=S.cars.find(c=>c.id===id);
  if(!car||car.cleaned)return;
  const cost=cleanCost(car);
  if(S.money<cost){news("💦 お金が足りません");return;}
  S.money-=cost;S.month.expense+=cost;
  car.cond=2;car.cleaned=true;
  car.market=Math.round(car.market*1.12/10000)*10000;
  car.price=tierPrice(car);
  news("✨ "+car.name+" がピカピカになりました！");
  if(S.tut===1){S.tut=2;}
  checkMoney();renderAll();updateGuide();autoSave();
}
/* ================= 値段をつける（3択） ================= */
function setTier(id,tier){
  const car=S.cars.find(c=>c.id===id);
  if(!car)return;
  car.tier=tier;car.price=tierPrice(car);
  renderAll();autoSave();
}

/* ================= 開業準備と来客の計画 ================= */
const OPEN_YM=2026*12+6; /* 2026年6月に開業 */
function ymIdx(y,m){return y*12+m;}
function isPrep(){return S&&ymIdx(S.y,S.m)<OPEN_YM;} /* 4月・5月は開業準備中 */
function monthsOpen(){return ymIdx(S.y,S.m)-OPEN_YM;} /* 開業して何ヶ月目か（6月=0） */
function daysToOpen(){
  if(!isPrep())return 0;
  return Math.round((Date.UTC(2026,5,1)-Date.UTC(S.y,S.m-1,S.d))/86400000);
}
/* その月に来るお客さんの人数と日を決める */
function makePlan(fromToday){
  if(!S||isPrep()){if(S)S.plan=null;return;}
  const dim=daysInMonth(S.y,S.m);
  let n;
  if(monthsOpen()<=0){
    n=ri(1,3); /* 開業した月は 1〜3人 */
  }else{
    /* 妻 +1、店の大きさ（中+1・大+2）、半年ごとに +1（最大+2） */
    n=ri(1,3)+1+S.shopSize+Math.min(2,Math.floor(monthsOpen()/6));
  }
  const startD=fromToday?S.d:1;
  const pool=[];
  for(let d=startD;d<=dim;d++)pool.push(d);
  n=Math.min(n,pool.length);
  const days=[];
  for(let i=0;i<n;i++){const j=ri(0,pool.length-1);days.push(pool.splice(j,1)[0]);}
  days.sort(function(a,b){return a-b;});
  S.plan={y:S.y,m:S.m,days:days,spawned:0};
}
/* 計画が今月と合っていなければ作り直す（セーブ再開時の補完） */
function ensurePlan(){
  if(!S||isPrep())return;
  if(!S.plan||S.plan.y!==S.y||S.plan.m!==S.m)makePlan(true);
}

/* ================= お客さん ================= */
function genCustomer(){
  return {id:S.nextId++,name:pick(LAST)+" "+pick(FIRST),wantType:pick(TYPES),
    budget:Math.round(rnd(40,380))*10000,x:228,y:238,tx:200,ty:190,bubble:"",bubbleT:0,stay:0,served:false};
}
function spawnCustomer(){
  const cu=genCustomer();
  visitors.push(cu);
  cu.bubble=cu.wantType+"がほしい！";cu.bubbleT=4;
  peopleDirty();
}
function serveCustomer(cu){
  /* 希望タイプに合う車 → なければ一番安い車 → なければ帰る */
  let car=S.cars.find(c=>c.type===cu.wantType)||null;
  let match=true;
  if(!car&&S.cars.length){car=S.cars.slice().sort((a,b)=>a.price-b.price)[0];match=false;}
  if(!car){
    cu.bubble="車がない…";cu.bubbleT=3;cu.stay=2;
    news("🚶 "+cu.name+"さんが来ましたが、車がなくて帰りました");
    return;
  }
  if(!B&&waitQueue.length===0){startBattle(cu,car,match);}
  else if(waitQueue.length<serveCap()){
    waitQueue.push({cu:cu,carId:car.id,match:match});
    news("🚶 "+cu.name+"さんが待っています");
    renderWait();
  }else{
    cu.bubble="混んでるみたい…";cu.bubbleT=3;cu.stay=2;
    news("🚶 "+cu.name+"さんが来ましたが、混んでいて対応できませんでした");
  }
}
function removeVisitor(id){visitors=visitors.filter(v=>v.id!==id);peopleDirty();}

/* ================= サイコロバトル ================= */
function diceOdds(rank){
  const w=DICE_W[rank]||DICE_W.F;
  const tot=w.reduce(function(a,b){return a+b;},0);
  return {
    no:Math.round((w[0]+w[1])/tot*100),
    disc:Math.round((w[2]+w[3])/tot*100),
    full:Math.round((w[4]+w[5])/tot*100)
  };
}
function rollDice(rank){
  const w=DICE_W[rank]||DICE_W.F;
  const tot=w.reduce(function(a,b){return a+b;},0);
  let r=Math.random()*tot;
  for(let i=0;i<6;i++){r-=w[i];if(r<0)return i+1;}
  return 6;
}
function startBattle(cu,car,match){
  const st=bestStaff();
  B={cu:cu,carId:car.id,match:match,staffName:st.name,rank:st.rank,
     price:car.price,phase:"ready",dice:0,salePrice:0,anim:null,
     last:cu.name+"さんは "+car.name+" を見ています。サイコロをふって売れるか決めよう！"};
  if(S.tut===3){S.tut=-1;}
  openModal("battleModal");
  renderBattle();
}
function battleRoll(){
  if(!B||B.phase!=="ready")return;
  const car=S.cars.find(c=>c.id===B.carId);
  if(!car){endBattle("車がなくなったので、バトルはおわりです");return;}
  B.phase="rolling";
  renderBattle();
  const face=rollDice(B.rank);
  let n=0;
  B.anim=setInterval(function(){
    if(!B){return;}
    B.dice=ri(1,6);
    renderBattle();
    n++;
    if(n>=11){
      clearInterval(B.anim);B.anim=null;
      B.dice=face;B.phase="done";
      if(face<=2){B.last="🎲 "+face+"… ざんねん！ "+B.cu.name+"さんは買ってくれませんでした";}
      else if(face<=4){B.salePrice=Math.round(car.price*0.9/10000)*10000;B.last="🎲 "+face+"！ 値引きで売れた！（1割引きの "+man(B.salePrice)+"）";}
      else{B.salePrice=car.price;B.last="🎲 "+face+"！ 店頭価格の "+man(B.salePrice)+" で売れた！";}
      renderBattle();
    }
  },80);
}
function battleOk(){
  if(!B||B.phase!=="done")return;
  const car=S.cars.find(c=>c.id===B.carId);
  if(B.dice>=3&&car){finishSale(car);}
  else{endBattle(null);}
}
function finishSale(car){
  const cu=B.cu,price=B.salePrice||B.price,dice=B.dice;
  B=null;closeModal("battleModal");
  S.money+=price;S.month.income+=price;S.month.sold++;
  S.sold++;
  const oldRank=bossRank();
  S.bossExp++;
  S.cars=S.cars.filter(c=>c.id!==car.id);
  news("🎉 "+cu.name+"さんが "+car.name+" を "+man(price)+" で買ってくれました！（サイコロ "+dice+"）");
  removeVisitor(cu.id);
  if(bossRank()!==oldRank){
    $("popBody").innerHTML="<div class='rankpop'>🎊</div><p style='text-align:center;font-size:18px'><b>社長の営業ランクが上がった！</b><br>営業ランク <span class='rankbig' style='color:"+RANK_COLOR[bossRank()]+"'>"+bossRank()+"</span><br><span class='small'>サイコロで いい目が出やすくなったよ</span></p>";
    openModal("popModal");
  }
  renderAll();renderWait();autoSave();
}
function endBattle(msg){
  if(!B)return;
  if(B.anim){clearInterval(B.anim);B.anim=null;}
  const cu=B.cu;B=null;closeModal("battleModal");
  if(msg)news(msg);
  removeVisitor(cu.id);
  renderAll();renderWait();
}
function quitBattle(){if(!B||B.phase==="rolling")return;news(B.cu.name+"さんとのバトルをやめました");endBattle(null);}
function startNextBattle(){
  if(B)return;
  while(waitQueue.length){
    const q=waitQueue.shift();
    const car=S.cars.find(c=>c.id===q.carId)||S.cars.find(c=>c.type===q.cu.wantType)||S.cars[0];
    if(!car){removeVisitor(q.cu.id);continue;}
    startBattle(q.cu,car,q.match&&car.type===q.cu.wantType);
    renderWait();
    return;
  }
  renderWait();
}

/* ================= 仲間 ================= */
function refreshCandidates(){
  S.candidates=[];
  const used=S.staff.map(s=>s.name);
  for(let i=0;i<3;i++){
    let nm=pick(STAFF_NAMES);let guard=0;
    while((used.includes(nm)||S.candidates.some(c=>c.name===nm))&&guard++<20)nm=pick(STAFF_NAMES);
    const rank=pick(["F","E","D","D","C","C","B","B","A"]);
    S.candidates.push({name:nm,rank:rank,salary:RANK_SALARY[rank]});
  }
}
function hireStaff(name){
  const idx=S.candidates.findIndex(c=>c.name===name);
  if(idx<0)return;
  if(S.staff.length>=4){news("👥 仲間は4人までです");return;}
  const c=S.candidates[idx];
  S.staff.push({id:S.nextId++,name:c.name,rank:c.rank,salary:c.salary});
  S.candidates.splice(idx,1);
  news("👥 "+c.name+"さんが仲間になりました！（同時に相手できるお客さんが増えたよ）");
  peopleDirty();renderAll();autoSave();
}
function fireStaff(id){
  const s=S.staff.find(x=>x.id===id);
  if(!s)return;
  if(!confirm(s.name+"さんに やめてもらいますか？"))return;
  S.staff=S.staff.filter(x=>x.id!==id);
  news("👥 "+s.name+"さんが やめました");
  peopleDirty();renderAll();autoSave();
}

/* ================= 店を大きくする ================= */
function growShop(){
  if(S.shopSize>=2)return;
  const nx=SHOP_SIZES[S.shopSize+1];
  if(S.money<nx.cost*10000){news("💦 お金が足りません");return;}
  S.money-=nx.cost*10000;S.month.expense+=nx.cost*10000;
  S.shopSize++;
  news("🏢 店が大きくなりました！ 置ける車が "+nx.cap+"台 になりました");
  checkMoney();renderAll();autoSave();
}

/* ================= お金・月・終わり ================= */
function checkMoney(){
  if(!S||S.over)return;
  if(S.money<0){
    if(!S.rescued){
      S.rescued=true;S.money+=300*10000;
      $("popBody").innerHTML="<p style='font-size:18px;text-align:center'>🏦 <b>銀行が助けてくれた！</b><br>+300万円 が入りました。<br><span class='small'>助けてもらえるのは 1回だけ。次にマイナスになったら おしまいです</span></p>";
      openModal("popModal");
      renderAll();autoSave();
    }else{
      S.over=true;
      $("overBody").innerHTML="<p style='text-align:center;font-size:17px'>🎉 売れた車 <b>"+S.sold+"台</b><br>📅 続いた日数 <b>"+S.days+"日</b><br><span class='small'>よくがんばりました！ また遊んでね</span></p>";
      openModal("overModal");
      autoSave();
    }
  }
}
let marketDirty=false;
function nextDay(){
  S.d++;S.days++;
  if(S.d>daysInMonth(S.y,S.m)){S.d=1;S.m++;if(S.m>12){S.m=1;S.y++;}monthEnd();}
  /* 「車を買う」画面を見ている間は並びを入れ替えない（見えている車とデータがズレて、買うボタンが効かなくなるため） */
  if(curPanel==="buy"){marketDirty=true;}else{refreshMarket();}
  /* お客さんは「今月の計画」で決まった日に来る（開業準備中は来ない） */
  ensurePlan();
  /* 計画の日を過ぎていたら、次の日にまとめて来る（バトル中などで来られなかった分を取りこぼさない） */
  if(!isPrep()&&S.plan&&!B){
    const due=S.plan.days.filter(function(d){return d<=S.d;}).length;
    if(due>(S.plan.spawned||0)){S.plan.spawned=(S.plan.spawned||0)+1;spawnCustomer();}
  }
  renderTop();
  renderPanel();
  updateGuide();
}
function daysInMonth(y,m){return [31,(y%4===0?29:28),31,30,31,30,31,31,30,31,30,31][m-1];}
function monthEnd(){
  /* 先月分のお給料を払う */
  const pay=S.staff.reduce((a,s)=>a+s.salary,0)*10000;
  if(pay>0){S.money-=pay;S.month.expense+=pay;}
  const pm=S.month;
  $("monthBody").innerHTML=
    "<div class='moneyrow'><span>🎉 売れた車</span><span class='v'>"+pm.sold+"台</span></div>"+
    "<div class='moneyrow'><span>💰 入ったお金</span><span class='v'>"+man(pm.income)+"</span></div>"+
    "<div class='moneyrow'><span>💸 出たお金</span><span class='v'>"+man(pm.expense)+"</span></div>"+
    (pay>0?"<p class='note'>仲間のお給料 "+man(pay)+" を払いました</p>":"")+
    "<div class='moneyrow' style='border-top:2px solid #e5c98c;margin-top:6px;padding-top:8px'><span>🏦 今のお金</span><span class='v'>"+man(Math.max(0,S.money))+"</span></div>";
  S.month={sold:0,income:0,expense:0};
  /* 新しい月の来客計画を立てる（開業後の月だけ） */
  if(!isPrep())makePlan(false);
  /* 6月になったらグランドオープン */
  if(S.y===2026&&S.m===6&&!S.opened){S.opened=true;pendingOpenParty=true;}
  openModal("monthModal");
  refreshCandidates();
  checkMoney();
  renderAll();autoSave();
}
/* 今月のまとめを閉じる（グランドオープンのお祝いが待っていたら出す） */
let pendingOpenParty=false;
function closeMonth(){
  closeModal("monthModal");
  if(pendingOpenParty){
    pendingOpenParty=false;
    $("popBody").innerHTML="<div class='rankpop'>🎉</div>"+
      "<p style='text-align:center;font-size:19px'><b>グランドオープン！</b></p>"+
      "<p style='text-align:center'>今日から お客さんが来るようになりました。<br>今月は <b>"+(S.plan?S.plan.days.length:0)+"人</b> くらい 来る予定です。<br><span class='small'>車を並べて、お客さんを待とう！</span></p>";
    openModal("popModal");
    news("🎉 グランドオープン！ 今日からお客さんが来ます");
  }
}
function gameOverToTitle(){closeModal("overModal");showTitle();}

/* ================= 時間 ================= */
function setSpeed(n){if(!S)return;S.speed=n;renderSpeed();autoSave();}
function renderSpeed(){for(let i=0;i<3;i++){const b=$("sp"+i);if(b)b.classList.toggle("on",S&&S.speed===i);}}
setInterval(()=>{
  if(!S||S.over||B)return;
  if(document.querySelector(".modal.open"))return;
  if(S.speed===0)return;
  dayCarry+= (S.speed===2?0.34:0.12);
  while(dayCarry>=1){dayCarry-=1;nextDay();}
},100);

/* ================= チュートリアル案内 ================= */
const TUT_TEXT=[
  "👋 はじめまして！ まず「🚗 車を買う」から 車を買おう！",
  "✨ いいね！ 次は「🚙 車」で、車をキレイにしよう！",
  "🏷️ 値段は「おすすめ」が付いているから そのままでOK！（変えたいときは 🚙 車 の画面で3つから選べるよ）",
  "🚶 あとは お客さんが来るのを待とう。来たらサイコロバトルだ！"
];
function updateGuide(){
  const g=$("guide");
  if(!S||S.tut<0){g.classList.add("hidden");return;}
  g.classList.remove("hidden");
  let btn="";
  if(S.tut===2)btn=" <button class='good' onclick='tutOk()'>わかった！</button>";
  let text=TUT_TEXT[S.tut];
  if(S.tut===3&&isPrep())text="🏗️ いまは開業準備中だよ。6月1日のオープンまで、車を買って そろえておこう！ オープンしたら お客さんが来るよ";
  g.innerHTML=text+btn+" <button onclick='tutSkip()' style='float:right'>スキップ</button>";
}
function tutOk(){if(S&&S.tut===2){S.tut=3;updateGuide();autoSave();}}
function tutSkip(){if(S){S.tut=-1;updateGuide();autoSave();}}

/* ================= お知らせ ================= */
function news(msg){if(S)S.log=msg;const n=$("news");if(n)n.textContent=msg;}
function openModal(id){$(id).classList.add("open");}
function closeModal(id){$(id).classList.remove("open");renderWait();}
</script>

<script>
/* ================= 画面表示 ================= */
function renderAll(){if(!S)return;renderTop();renderSpeed();renderPanel();renderWait();news(S.log||"");}
function renderTop(){
  if(!S)return;
  $("tbDate").textContent="📅 "+S.y+"年"+S.m+"月"+S.d+"日";
  $("tbMoney").textContent="💰 "+man(Math.max(0,S.money));
  $("tbMoney").style.color=S.money<100*10000?"#c0392b":"#b97a00";

/* ================= 店の絵（手描き風フラット・太い輪郭線） ================= */
const INK="#3a2e22";
function rr(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
function shade(hex,f){
  const n=parseInt(hex.slice(1),16);
  let r=(n>>16)&255,gg=(n>>8)&255,b=n&255;
  if(f>=1){r=Math.min(255,Math.round(r+(255-r)*(f-1)));gg=Math.min(255,Math.round(gg+(255-gg)*(f-1)));b=Math.min(255,Math.round(b+(255-b)*(f-1)));}
  else{r=Math.round(r*f);gg=Math.round(gg*f);b=Math.round(b*f);}
  return "rgb("+r+","+gg+","+b+")";
}
function poly(g,pts,fill,lw){
  g.beginPath();g.moveTo(pts[0][0],pts[0][1]);
  for(let i=1;i<pts.length;i++)g.lineTo(pts[i][0],pts[i][1]);
  g.closePath();
  if(fill){g.fillStyle=fill;g.fill();}
  g.strokeStyle=INK;g.lineWidth=lw||2.5;g.lineJoin="round";g.stroke();
}
function spark(g,x,y,r){
  g.beginPath();
  g.moveTo(x,y-r);g.quadraticCurveTo(x,y,x+r,y);g.quadraticCurveTo(x,y,x,y+r);g.quadraticCurveTo(x,y,x-r,y);g.quadraticCurveTo(x,y,x,y-r);
  g.fillStyle="#ffd94d";g.fill();g.strokeStyle=INK;g.lineWidth=1.4;g.stroke();
}
/* アイソメの箱（上面・側面・前面）を太い輪郭線で描く */
function isoBox(g,cx,cy,L,W,h,cols,lw){
  const ux=[L/2,L/4],vx=[-W/2,W/4];
  const A=[cx+ux[0]+vx[0],cy+ux[1]+vx[1]];
  const Bp=[cx+ux[0]-vx[0],cy+ux[1]-vx[1]];
  const C=[cx-ux[0]-vx[0],cy-ux[1]-vx[1]];
  const D=[cx-ux[0]+vx[0],cy-ux[1]+vx[1]];
  const up=function(p){return [p[0],p[1]-h];};
  const A2=up(A),B2=up(Bp),C2=up(C),D2=up(D);
  poly(g,[A,D,D2,A2],cols.side,lw);
  poly(g,[Bp,A,A2,B2],cols.front,lw);
  poly(g,[A2,B2,C2,D2],cols.top,lw);
  return {A:A,B:Bp,C:C,D:D};
}

function drawTree(g,x,y){

  g.fillStyle="#6b4a33";rr(g,x-4.5,y-2,9,25,3);g.fill();g.strokeStyle=INK;g.lineWidth=2.2;rr(g,x-4.5,y-2,9,25,3);g.stroke();
  g.fillStyle="#7d9b6a";
  [[0,-18,19],[-15,-8,14],[15,-8,14],[0,-3,15]].forEach(function(c){
    g.beginPath();g.arc(x+c[0],y+c[1],c[2],0,7);g.fill();g.strokeStyle=INK;g.lineWidth=2.2;g.stroke();
  });

function drawCar(g,x,y,c){

    g.fillStyle="#6b5a48";
    g.beginPath();g.ellipse(wsTop+26,beltY-6,7,5,0,0,7);g.fill();
    g.beginPath();g.ellipse(wsTop+44,beltY-6,7,5,0,0,7);g.fill();
  }else{
    /* フロントガラス（正面側） */
    polyFill(g,[[frontX+9,hoodY-7],[frontX+30,roofY+16],[frontX+47,roofY+15],[frontX+41,hoodY-3]],glass,1.4);
    /* サイドガラス */
    const gx0=wsBase+8, gx1=roofRear-8;
    polyFill(g,[[gx0,hoodY-9],[wsTop+3,roofY+7],[roofRear-4,roofY+7],[gx1,beltY-3],[gx0+14,beltY-3]],glass,1.6);
    /* 映り込み */
    g.fillStyle="rgba(255,255,255,.35)";
    polyFill(g,[[gx0+16,hoodY-9],[wsTop+16,roofY+7],[wsTop+27,roofY+7],[gx0+30,beltY-3],[gx0+22,beltY-3]],"rgba(255,255,255,.30)",0);
    /* ピラー（柱） */
    g.fillStyle=col;
    const pilW=geo.boxy?7:6;
    g.fillRect(wsTop+26,roofY+6,pilW,beltY-roofY-9);
    if(geo.boxy||st.cabin==="suv")g.fillRect((gx0+gx1)/2+8,roofY+6,pilW,beltY-roofY-9);
    /* ルーフレール */
    if(st.rails){
      g.strokeStyle=shade(col,.62);g.lineWidth=3.4;g.lineCap="round";
      g.beginPath();g.moveTo(wsTop+8,roofY-4);g.lineTo(roofRear-4,roofY-4);g.stroke();
      g.lineWidth=2.4;
      g.beginPath();g.moveTo(wsTop+20,roofY-4);g.lineTo(wsTop+20,roofY+1);g.stroke();
      g.beginPath();g.moveTo(roofRear-16,roofY-4);g.lineTo(roofRear-16,roofY+1);g.stroke();
    }
    /* スポイラー */
    if(st.spoiler){
      polyFill(g,[[roofRear-16,roofY+1],[rearX-2,roofY+9],[rearX+1,roofY+14],[roofRear-12,roofY+8]],shade(col,.8),1.6);
    }
  }
  /* ---- フロントフェイス（正面パネル） ---- */
  const fp=[[frontX+1,hoodY-5],[frontX+43,hoodY+1],[frontX+43,botY-3],[frontX+1,botY-5]];
  polyFill(g,fp,grad34(g,hoodY,botY,shade(col,1.05),shade(col,.88)),1.8);
  const fx=frontX+22, fy=hoodY+13;
  /* ヘッドライト（手前=大きく、奥=小さく） */
  headlight34(g,fx+9,fy,1.05,st.light,false);
  headlight34(g,fx-14,fy-1,.68,st.light,true);
  /* エンブレム */
  g.fillStyle="rgba(255,255,255,.75)";g.beginPath();g.arc(fx,hoodY+3,3,0,7);g.fill();
  g.strokeStyle="rgba(120,125,130,.7)";g.lineWidth=1;g.stroke();
  /* グリル */
  if(st.grille>0){
    const gw=12+st.grille*9, gh=6+st.grille*3.4;
    rr(g,fx-gw/2,hoodY+22,gw,gh,3.5);
    g.fillStyle="#3c4046";g.fill();g.strokeStyle="rgba(90,74,58,.5)";g.lineWidth=1.2;g.stroke();
    g.strokeStyle="rgba(220,226,232,.75)";g.lineWidth=1.4;
    for(let i=1;i<=2;i++){g.beginPath();g.moveTo(fx-gw/2+3,hoodY+22+gh*i/3);g.lineTo(fx+gw/2-3,hoodY+22+gh*i/3);g.stroke();}
  }
  /* バンパーの吸気口 */
  rr(g,fx-14,GY-26,28,8,3.5);g.fillStyle="#454a51";g.fill();
  /* スキッドプレート（SUV風バンパー） */
  if(st.bumper){
    polyFill(g,[[frontX+4,GY-13],[frontX+40,GY-11],[frontX+38,GY-5],[frontX+6,GY-5]],"#c8ccd1",1.2);
    headlight34(g,fx-15,GY-19,.4,"round",true);
    headlight34(g,fx+16,GY-19,.4,"round",true);
  }
  /* ナンバープレート（白） */
  rr(g,fx-11,GY-24,22,12,2.5);
  g.fillStyle="#f7f8f5";g.fill();g.strokeStyle="#a9adb2";g.lineWidth=1.3;g.stroke();
  g.fillStyle="#c3c8cc";g.fillRect(fx-6,GY-20,12,2);g.fillRect(fx-6,GY-16.5,12,2);
  /* ---- サイドの細部 ---- */
  const line="rgba(74,59,42,.30)";
  /* キャラクターライン */
  g.strokeStyle="rgba(255,255,255,.35)";g.lineWidth=2;
  g.beginPath();g.moveTo(frontX+50,beltY+9);g.quadraticCurveTo(140,beltY+5,rearX-12,beltY+10);g.stroke();
  /* ドアの境目 */
  g.strokeStyle=line;g.lineWidth=1.6;
  const doorX1=wsBase+44, doorX2=doorX1+52;
  g.beginPath();g.moveTo(doorX1,beltY+1);g.lineTo(doorX1,botY-10);g.stroke();
  if(geo.boxy||st.cabin==="suv"||st.cabin==="sedan"||st.cabin==="slope"){
    g.beginPath();g.moveTo(doorX2,beltY+1);g.lineTo(doorX2,botY-10);g.stroke();
  }
  /* ドアハンドル */
  g.fillStyle="rgba(74,59,42,.4)";
  rr(g,doorX1-13,beltY+5,9,3,1.5);g.fill();
  rr(g,doorX2-13,beltY+5,9,3,1.5);g.fill();
  /* スライドドアのレール */
  if(st.slide){
    g.strokeStyle="rgba(74,59,42,.38)";g.lineWidth=2;
    g.beginPath();g.moveTo(doorX1+4,beltY+7);g.lineTo(rearX-6,beltY+7);g.stroke();
  }
  /* ドアミラー */
  const mx=wsBase+2, my=beltY-3;
  g.strokeStyle=OUT34;g.lineWidth=2;
  g.beginPath();g.moveTo(mx,my+3);g.lineTo(mx+5,my-3);g.stroke();
  rr(g,mx+3,my-9,12,8,3);g.fillStyle=shade(col,.95);g.fill();g.strokeStyle=OUT34;g.lineWidth=1.8;g.stroke();
  rr(g,mx+5,my-7.5,6,5,2);g.fillStyle="#b9c9d2";g.fill();
  /* ---- ホイールアーチとタイヤ ---- */
  const wr=geo.wheel, fwX=frontX+38, rwX=rearX-38, wY=GY-3;
  g.fillStyle="rgba(50,40,30,.28)";
  g.beginPath();g.ellipse(fwX,wY,wr+4,wr*.6,0,Math.PI,0);g.fill();
  g.beginPath();g.ellipse(rwX,wY,wr+4,wr*.6,0,Math.PI,0);g.fill();
  wheel34(g,fwX,wY,wr);
  wheel34(g,rwX,wY,wr);
  /* ツヤ */
  g.fillStyle="rgba(255,255,255,.16)";
  g.beginPath();g.ellipse((frontX+rearX)/2,hoodY+16,(rearX-frontX)*.32,5,-.02,0,7);g.fill();
  /* 状態の表現 */
  if(car.cond===0){
    g.fillStyle="rgba(105,80,50,.32)";
    [[70,112,20,6],[150,118,24,6],[110,121,15,5],[196,108,12,5],[52,120,13,5]].forEach(function(d){g.beginPath();g.ellipse(d[0],d[1],d[2],d[3],0,0,7);g.fill();});
  }
  if(car.cond===2){spark(g,44,18,7);spark(g,222,12,5);spark(g,120,8,4.5);}
}

/* ================= 起動 ================= */
showTitle();
</script>
